# 自用通用 Agent 系统配置示例
# 复制为 config.yml 后按需修改；容器内通过 AGENT_CONFIG 指定路径。

# 模型池：每个模型独立配置上游 url 与 api_key（互不共用，可指向不同代理/账号）。
# 同时活跃会话数上限 = 模型数量。
models:
  - id: ds1
    display_name: "AMD DeepSeek 1"
    url: "https://proxy-a.example.com/v1"   # 独立的 OpenAI 兼容 /v1 地址
    api_key: "sk-..."                        # 各模型可不同，留空则不带鉴权头
    # vision: true                           # 选填，默认 false；支持时 read_file 读图会压缩回传（长边≤2000px JPEG），会话上下文会告知 AI
  - id: ds2
    display_name: "AMD DeepSeek 2"
    url: "https://proxy-b.example.com/v1"
    api_key: "sk-..."
  - id: ds3
    display_name: "AMD DeepSeek 3"
    url: "https://proxy-c.example.com/v1"
    api_key: ""

workspace_root: "./data/tasks"
# db_path: "/data/.agent.db"

# 日志等级（改后重启生效）：debug < info < warn < error < none，只输出 ≥ 该等级的日志；none=全部静默。
# info（默认）=关键动作概述；debug 另加用户/AI 消息全文、工具调用参数/结果等排查细节。
log_level: info

terminal:
  default_timeout_ms: 30000
  max_output_chars: 10000

# Skill Manager：技能根目录，所有任务/会话共享（容器内挂 ./skills → /workspace/skills）。
# skills_root 缺省取 workspace_root 的同级 skills 目录（如 /workspace/tasks → /workspace/skills）；可显式覆盖。
skills:
  skills_root: "/workspace/skills"
  timeout_ms: 120000   # 单个技能执行超时，默认 120 秒

agent:
  temperature: 1.0
  max_tool_iterations: 20
  max_retries: 2
  # 回复语言：注入到 system prompt 末尾，强制模型用该语言回复用户
  # （工具名/代码/命令保持原样）；留空则不限制。改后重启生效。
  language: "中文"

# 大图上传预处理：图片超过 threshold_kb（默认 1.5M）时，浏览器端询问是否压缩；
# 同意后在用户本地 canvas 压缩（长边 ≤ image_max_dim，JPEG image_quality）再上传。
upload:
  image_compress_threshold_kb: 1536
  image_max_dim: 2000
  image_quality: 0.85

# 模型保持占用（held）租约：AI 答完后不立即释放模型，用户追问可直接复用。
# 页面无人观看超过 idle_release_ms 释放；有人观看最长保持 active_max_ms；sweep_ms 巡检间隔。
# 新建后从未发言的空闲会话也按同一租约自动释放。
model_hold:
  idle_release_ms: 180000   # 3 分钟
  active_max_ms: 1800000    # 30 分钟
  sweep_ms: 10000           # 10 秒

# 登录认证（推荐启用）：多用户，用户名/明文密码直接配在这里（自用场景）。
# 登录页 /login，会话 token 以 HttpOnly cookie 下发（替代 nginx htpasswd：
# 手机浏览器原生下载不带 Basic 认证头，cookie 则会自动携带，下载不再失败）。
# 仍兼容 Authorization: Basic 头（curl/API 脚本可用）。
# secret：签名密钥；留空则启动时随机生成（重启后需重新登录），建议固定随机串。
# 登录页支持用 localStorage 里的 token 静默恢复登录态（POST /api/login_restore），
# 兼容 Android WebView 封装 APK 杀进程后 cookie 未落盘的场景。
# 整段删除或 users 留空则不启用认证。
# auth:
#   secret: "change-me"        # 选填；建议固定，避免重启掉登录态
#   ttl_ms: 2592000000         # 选填，登录态有效期，默认 30 天
#   users:
#     - user: admin
#       password: "change-me"
#     - user: alice
#       password: "s3cret"

# MCP 服务（可配多个；与内置工具分开）。启动时对每个服务调 tools/list 发现工具，
# 追加到内置工具之后一起发给模型；调用经 tools/call 转发。headers 是任意请求头（如 Authorization）。
# 服务不可用时只在启动日志告警，不影响其他服务与内置工具。
mcp_servers:
  - name: web-search                                   # 选填，缺省取主机名首段
    url: "https://web-search.ai.foresh.com/"
    headers:
      Authorization: "Basic a2ljZXI6USF3MmUzcjQ="
