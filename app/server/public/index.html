<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover：让 env(safe-area-inset-*) 生效（缺了它 iOS 上恒为 0）；
       interactive-widget=resizes-content：键盘弹起时缩 layout viewport（新 Chromium 认；
       不认的浏览器会忽略，由 js/viewport.js 的 --kb 兜底）。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Agent 任务台</title>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/prism.min.js"></script>
  <meta name="theme-color" content="#3964FE">
  <!-- 主题首屏：先落 data-theme，避开刷新时的白屏闪一下。默认浅色，手动切过后存 localStorage -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem('agent-theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', m);
        document.documentElement.setAttribute('data-theme-mode', m);
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.setAttribute('data-theme-mode', 'light');
      }
    })();
  </script>

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agent">

  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
    <style>
      /* 「压缩」摘要卡片：与 .msg-ctx（画像快照/渠道/记忆）同一套视觉——淡蓝底、蓝边蓝字、
         三角箭头、虚线分隔。纯色不用渐变/阴影，折叠与展开同一底色。默认收起 */
      .msg-summary {
        width: 100%; /* .msg.other 是 align-items:flex-start 的列 flex，不写就只撑标题那点宽 */
        margin: 0 0 8px; border: 1px solid var(--bd-dbe4fb); border-radius: 12px; overflow: hidden;
        background: var(--bg-f7f9ff);
      }
      .msg-summary > summary {
        list-style: none; cursor: pointer; user-select: none;
        display: flex; align-items: center; gap: 7px;
        padding: 9px 12px; font-size: 13px; font-weight: 600; color: var(--active);
      }
      .msg-summary > summary::-webkit-details-marker { display: none; }
      .msg-summary > summary::before {
        content: ''; flex: none; width: 0; height: 0; margin-left: 1px;
        border-left: 5px solid var(--active); border-top: 4px solid transparent; border-bottom: 4px solid transparent;
        transition: transform .15s ease;
      }
      .msg-summary[open] > summary::before { transform: rotate(90deg); }
      .msg-summary-body {
        /* 比标题区深一档（用变量，暗色自动跟随） */
        border-top: 1px dashed var(--bd-dbe4fb); background: var(--bg-fbfcff);
        padding: 10px 13px 12px;
      }
      .msg-summary-body .bubble-ai { margin: 0; background: transparent; font-size: 14px; line-height: 1.7; }
      /* 「仅摘要」后摘要之前的旧历史：UI 保留但变淡，尾部附存档说明（不再发给 AI） */
      .msg-archived { opacity: .55; }
      .archived-note {
        display: flex; align-items: center; gap: 8px;
        margin: 10px 0 12px; font-size: 11px; color: var(--gray);
      }
      .archived-note::before, .archived-note::after { content: ''; flex: 1; height: 1px; background: var(--border); }

      /* schedule 弹窗控件（.modal select/input 的 100% 宽会撑满整行，这里收窄成本行内样式） */
      #schedule-modal .sched-row { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 14px; color: var(--ink); flex-wrap: wrap; }
      #schedule-modal .sched-row select,
      #schedule-modal .sched-row input {
        width: auto; margin: 0; padding: 7px 8px; font-size: 14px;
        border: 1px solid var(--bd-dde1ea); border-radius: 8px; background: var(--bg-fff); color: var(--ink);
      }
      #schedule-modal .sched-row select { appearance: none; -webkit-appearance: none; }
      #schedule-modal .sched-row .sched-num { width: 52px; text-align: center; }
      #schedule-modal .sched-row .sched-grow { flex: 1; min-width: 130px; font-family: monospace; }
      #schedule-modal .sched-meta { font-size: 12.5px; color: var(--gray); margin-bottom: 10px; white-space: pre-wrap; }
      /* schedule 弹窗内的提示词编辑区（.modal input 不覆盖 textarea，单独给样式） */
      #schedule-modal textarea {
        width: 100%; box-sizing: border-box; display: block;
        border: 1px solid var(--bd-dde1ea); border-radius: 10px;
        padding: 10px 12px; font-size: 14px; line-height: 1.5;
        margin-bottom: 10px; background: var(--bg-fff); color: var(--ink); resize: vertical;
      }
      #schedule-modal textarea:focus { border-color: var(--active); }
      /* welcome 头像兼做「选择模型」入口（与聊天态的「选择模型」同一弹窗） */
      .logo-badge { cursor: pointer; }
    </style>
  <script>
    // 注册 Service Worker（PWA / 离线缓存）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('[SW] register failed:', err);
        });
      });
    }
  </script>

    <!-- ================= 顶部导航栏 ================= -->

      <button class="icon-btn" id="menu-btn" title="历史记录" aria-label="打开历史记录">
        <svg viewBox="0 0 24 24" class="ic sm"><use href="#i-history"/></svg>
      </button>
      <div class="header-center" id="header-center"><!-- 未对话状态为空白,JS 注入对话信息 --></div>

      <!-- 标题右侧的会话属性区（仅桌面端）：模型名（文字）/ 定时任务（无任务=灰色入口·有任务=紫色频次）/ 压缩。
           无会话时只留模型占位（选模型），定时与压缩隐藏。 -->
      <div class="header-meta" id="header-meta">

          <svg class="ic" viewBox="0 0 24 24"><use href="#i-database"/></svg>
        </button>
      </div>

      <!-- 右侧动作区：桌面端只留「新建会话」；移动端整组收进「更多」下拉菜单。
           桌面属性区与菜单项共用 data-act，事件统一在 sessions.js 分发。 -->
      <div class="header-actions" id="header-actions">
        <div class="ha-icons">
          <button class="icon-btn ha-btn" data-act="new" data-tip="新建会话" aria-label="新建会话">
            <svg class="ic sm" viewBox="0 0 24 24"><use href="#i-plus"/></svg>
          </button>
        </div>
        <button class="icon-btn ha-more" id="ha-more" title="更多" aria-label="更多操作" aria-haspopup="menu" aria-expanded="false" aria-controls="ha-menu">
          <svg class="ic sm" viewBox="0 0 24 24"><use href="#i-more"/></svg>
        </button>
        <div class="ha-menu hidden" id="ha-menu" role="menu">
          <button class="ha-item" role="menuitem" data-act="model">
            <svg class="ic sm" viewBox="0 0 24 24"><use href="#i-sliders"/></svg>
            <span class="ha-item-main">切换模型</span><span class="ha-item-sub hidden" id="ha-model-sub"></span>
          </button>
          <button class="ha-item" role="menuitem" data-act="schedule">
            <svg class="ic sm" viewBox="0 0 24 24"><use href="#i-clock"/></svg>
            <span class="ha-item-main">定时任务</span><span class="ha-item-sub hidden" id="ha-sched-sub"></span>
          </button>
          <button class="ha-item" role="menuitem" data-act="compact">
            <svg class="ic sm" viewBox="0 0 24 24"><use href="#i-database"/></svg>
            <span class="ha-item-main">压缩上下文</span>
          </button>
          <button class="ha-item" role="menuitem" data-act="new">
            <svg class="ic sm" viewBox="0 0 24 24"><use href="#i-plus"/></svg>
            <span class="ha-item-main">新建会话</span>
          </button>
        </div>
      </div>
    </header>

    <main>
      <!-- ================= 未对话状态:欢迎页 ================= -->
      <section id="welcome-view">
        <div class="welcome-head">
          <div class="logo-badge" onclick="openModelSwitch()" title="选择模型" role="button" aria-label="选择模型">
            <svg class="ic" viewBox="0 0 24 24"><use href="#i-robot"/></svg>
          </div>
          <div class="welcome-slogan">随时开始吧</div>
        </div>
        <!-- 本地端：新建会话时手选工作目录（服务器形态由 JS 整块隐藏）。
             只暂存在前端，真正建档时随 POST /api/sessions 提交一次；不选 = 老行为。 -->
        <div class="welcome-dir hidden" id="welcome-dir">
          <span class="welcome-dir-cap">工作目录</span>
          <button type="button" class="welcome-dir-pick" id="welcome-dir-pick" title="选择本会话的工作目录">
            <svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><use href="#i-folder"/></svg>
            <span class="welcome-dir-path" id="welcome-dir-path">默认</span>
          </button>
          <button type="button" class="welcome-dir-clear hidden" id="welcome-dir-clear" title="恢复默认目录" aria-label="恢复默认目录">
            <svg class="ic sm" viewBox="0 0 24 24"><use href="#i-x-line"/></svg>
          </button>
        </div>
      </section>

      <!-- ================= 对话状态:对话内容区 ================= -->
      <section id="chat-view" class="hidden"></section>
    </main>

    <!-- ================= 底部输入区 ================= -->
    <footer>
      <div class="attach-chips hidden" id="attach-chips"></div>
      <!-- 待发送条幅：运行中发出的消息先排在这里（不立即入库），逐条一行。
           默认等本轮结束自动发出；队首可「干预」（跑完当前这步就插话）或「立即发送」（中断本轮）。 -->
      <div class="send-queue hidden" id="send-queue" aria-live="polite"></div>
      <div class="input-shell">
        <!-- 编辑已发送消息：覆盖式重发提示条（发送后丢弃该条及其后的历史） -->
        <div class="edit-bar hidden" id="edit-bar">
          <span>编辑已发送消息：发送后将丢弃原历史信息</span>
          <button id="edit-cancel" type="button">取消</button>
        </div>
        <div class="up-cards hidden" id="up-cards" aria-label="已上传文件"></div>
        <textarea id="msg-input" placeholder="传送信息" rows="2" enterkeyhint="enter"></textarea>
        <!-- 语音模式：输入框位置变成「按住 说话」（只有居中文字，无按钮外观） -->
        <div id="voice-hold" class="hidden" role="button" tabindex="0" aria-label="按住说话">按住 说话</div>
        <div class="input-actions">
          <div class="ia-side ia-left">
            <button class="think-toggle" id="deep-think-btn" title="深度思考">
              <svg viewBox="0 0 24 24" class="ic sm"><use href="#i-bulb"/></svg>
              深度思考
            </button>
          </div>
          <div class="ia-side ia-right">
            <button class="plus-btn" id="files-btn" title="任务文件" aria-label="任务文件">
              <svg viewBox="0 0 24 24" class="ic sm"><use href="#i-folder-b"/></svg>
            </button>
            <button class="plus-btn" id="attach-btn" title="上传文件" aria-label="上传文件">
              <svg viewBox="0 0 24 24" class="ic sm"><use href="#i-paperclip"/></svg>
            </button>
            <!-- 同一按钮四态：发送（↑）/ 停止（方块）/ 语音（麦克风）/ 键盘。
                 data-state 由 JS 切换，尺寸不变避免输入区跳动 -->
            <button class="send-btn" id="send-btn" data-state="send" title="发送" aria-label="发送">
              <svg class="ic sm ic-send" viewBox="0 0 24 24"><use href="#i-send"/></svg>
              <svg class="ic sm ic-voice" viewBox="0 0 24 24"><use href="#i-mic"/></svg>
              <svg class="ic sm ic-kb" viewBox="0 0 24 24"><use href="#i-keyboard"/></svg>
              <span class="stop-sq" aria-hidden="true"></span>
            </button>
          </div>
        </div>
        <!-- 按住说话的遮罩：盖满输入卡并扩到屏幕两边（footer 有 12px 内边距 + shell 1px 边框）。
             声波由 JS 生成 25 根柱子；上滑到文案区域进入取消态（整体变红）。 -->
        <div id="voice-overlay" class="hidden" aria-hidden="true">
          <div class="vo-hint" id="voice-hint">松手传送，上滑取消</div>
          <div class="vo-wave" id="voice-wave"></div>
        </div>
      </div>
      <!-- 回到底部浮动按钮(搬自 index;上翻历史时出现、AI 输出中常驻转圈)。
           放在 footer 内、相对 footer 顶边停靠:输入框长高/编辑条出现时不会被盖住 -->
      <button class="scroll-bottom-btn hidden" id="scroll-bottom-btn" onclick="clickScrollBottom()" title="回到底部" aria-label="回到底部">
        <svg class="sb-arrow" viewBox="0 0 24 24"><use href="#i-chevron-down"/></svg>
        <svg class="sb-spinner hidden" viewBox="0 0 24 24"><use href="#i-spinner"/></svg>
      </button>
    </footer>

    <!-- ================= 历史记录抽屉 ================= -->
    <div id="scrim"></div>
    <aside id="drawer" aria-label="对话历史">
      <div class="drawer-search">
        <div class="search-box">
          <svg class="ic sm" viewBox="0 0 24 24"><use href="#i-search"/></svg>
          <input type="search" id="search-input" placeholder="搜寻对话内容..." enterkeyhint="search">
        </div>
      </div>
      <div class="drawer-list" id="drawer-list"></div>
      <div class="files-tree" id="files-tree"></div>
      <!-- 底部图标操作栏：文件树 / 设置（文件树按钮是「会话 ↔ 文件」的切换开关）。
           预览不占按钮：桌面端在文件树里点文件即开预览栏，关窗走预览栏自己的关闭钮。
           窄屏两个都隐藏：文件只保留输入行右侧的旧面板（不做两套）。选中项高亮。 -->
      <div class="drawer-actions" id="drawer-actions">
        <button class="drawer-act" id="da-files" type="button" title="文件树" aria-label="文件树">
          <svg viewBox="0 0 24 24"><use href="#i-folder"/></svg>
        </button>
        <button class="drawer-act" id="da-settings" type="button" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24"><use href="#i-gear"/></svg>
        </button>
      </div>
    </aside>

    <!-- ================= 任务文件面板(浮层:点输入行右侧文件夹按钮展开;盖住输入区+遮罩) ================= -->
    <div id="files-mask" aria-hidden="true"></div>
    <div class="files-panel" id="files-panel" aria-label="任务文件">
          <div class="files-panel-header">
            <div class="files-drag-handle" id="files-drag-handle" aria-label="拖拽调整高度"></div>
            <span class="files-panel-title">任务文件<span class="files-panel-size" id="files-panel-size" title="当前目录下全部文件总大小"></span></span>
            <label class="file-upload" title="上传文件" aria-label="上传文件">
              <input type="file" id="file-input" multiple hidden>
              <svg viewBox="0 0 24 24"><use href="#i-upload-cloud"/></svg>
            </label>
          </div>
          <div class="files-crumbs hidden" id="files-crumbs" aria-label="目录路径"></div>
          <div class="files-list" id="files-list"></div>
                <div class="files-panel-progress hidden" id="fp-progress" aria-live="polite">
                  <div class="fp-track"><div class="bar" id="fp-progress-bar"></div></div>
                  <span class="pct" id="fp-progress-pct">0%</span>
                </div>
                <div class="files-panel-footer">
            <div class="files-panel-footer-left">
              <span class="file-check files-panel-check" id="files-toggle-all" role="checkbox" aria-checked="false" aria-label="全选" title="全选" tabindex="0"></span>
              <span class="files-panel-count" id="files-count">未选择文件</span>
            </div>
            <div class="files-panel-actions">
              <button class="files-fab" id="files-bulk-download" title="批量下载" aria-label="批量下载" disabled>
                <svg viewBox="0 0 24 24"><use href="#i-download"/></svg>
              </button>
              <button class="files-fab del" id="files-bulk-delete" title="批量删除" aria-label="批量删除" disabled>
                <svg viewBox="0 0 24 24"><use href="#i-trash"/></svg>
              </button>
            </div>
          </div>
        </div>

    <!-- ================= 设置区(覆盖层;入口:侧边栏用户区) ================= -->
    <section id="settings-page" class="hidden" aria-label="设置">
      <!-- 垫底静态快照层:子页右滑返回时,父页快照垫在这里(仅动画背景,pointer-events:none;滑完重渲染真页) -->
      <div id="set-under" aria-hidden="true"></div>
      <!-- 当前页层:返回滑动只平移这一层,底下露出垫底的父页 -->
      <div id="set-top">
        <!-- 顶栏:左侧返回 + 中间标题 + 右侧操作按钮,风格与对话页 header 一致 -->
        <header class="header">
          <button class="icon-btn" id="set-back-btn" title="返回" aria-label="返回">
            <svg class="ic" viewBox="0 0 24 24"><use href="#i-chevron-left"/></svg>
          </button>
          <div class="header-center"><div class="header-title" id="set-title">设置</div></div>
          <div class="header-right" id="set-actions"><!-- JS 按页注入操作按钮 --></div>
        </header>
        <div id="set-body"><!-- JS 按页渲染 --></div>
      </div>
    </section>

    <!-- 新建技能弹窗(搬自 index) -->
    <div id="skill-create-modal" class="modal-overlay hidden" onclick="if(event.target===this)sUI.closeCreate()">
      <div class="modal">
        <button class="modal-close-btn" onclick="sUI.closeCreate()">
          <svg viewBox="0 0 24 24"><use href="#i-x-line-b"/></svg>
        </button>
        <h3>新建技能</h3>
        <input type="text" id="skill-new-name" placeholder="技能名(字母/数字/-/_)">
        <input type="text" id="skill-new-desc" placeholder="一句话描述(何时使用该技能)">
        <button class="primary-btn" onclick="sUI.createSkill()">创建</button>
      </div>
    </div>

    <!-- 平台编辑/新增弹窗(模型池共用:点卡片内任一模型=编辑整个平台;右上+模型=新增整个平台) -->
    <div id="model-edit-modal" class="modal-overlay hidden" onclick="if(event.target===this)sUI.mClose()">
      <div class="modal modal-wide">
        <button class="modal-close-btn" onclick="sUI.mClose()">
          <svg viewBox="0 0 24 24"><use href="#i-x-line-b"/></svg>
        </button>
        <h3 id="mpe-title">编辑平台</h3>
        <!-- 平台预设：仅新增平台时展示，点选即填好 url/类型并给模型卡带上该平台的参数缺省 -->
        <div class="mpe-chips hidden" id="mpe-presets"></div>
        <input type="text" id="mpe-name" placeholder="平台名(留空取 url 主机名首段)">
        <input type="text" id="mpe-url" placeholder="平台上游地址(OpenAI 兼容 /v1)">
        <div class="mpe-sec">
          <div class="mpe-sec-head"><span>Key列表</span><button class="ghost-btn sm" onclick="sUI.mAddKey()">添加Key</button></div>
          <div id="mpe-keys"></div>
        </div>
        <div class="mpe-sec">
          <div class="mpe-sec-head"><span>模型</span><button class="ghost-btn sm" onclick="sUI.mAddModel()">添加模型</button></div>
          <div id="mpe-models"></div>
        </div>
        <div class="btn-row mpe-foot">
          <button class="ghost-btn danger hidden" id="mpe-del-btn" onclick="sUI.mDelPlat()">删除平台</button>
          <button class="primary-btn" onclick="sUI.mSave()">保存</button>
        </div>
      </div>
    </div>

    <!-- 用户编辑弹窗（设置→用户；仅管理员）:用户名 / 密码 / 角色 / 默认模型;保存后即时生效无需重启 -->
    <div id="user-edit-modal" class="modal-overlay hidden" onclick="if(event.target===this)sUI.closeUserModal()">
      <div class="modal">
        <button class="modal-close-btn" onclick="sUI.closeUserModal()">
          <svg viewBox="0 0 24 24"><use href="#i-x-line-b"/></svg>
        </button>
        <h3 id="ue-title">添加用户</h3>
        <input type="text" id="ue-user" placeholder="用户名（字母/数字/下划线）" autocomplete="off">
        <input type="password" id="ue-pass" placeholder="初始密码（至少 6 位）" autocomplete="new-password">
        <select id="ue-role">
          <option value="user">普通用户（仅账户页）</option>
          <option value="admin">管理员（全部设置）</option>
        </select>
        <select id="ue-model"></select>
        <div class="btn-row mpe-foot">
          <button class="ghost-btn danger hidden" id="ue-del-btn" onclick="sUI.userDelFromModal()">删除用户</button>
          <button class="primary-btn" onclick="sUI.saveUser()">保存</button>
        </div>
        <div class="cfg-note">默认模型 = 该用户新建会话时自动选择的模型；选「不锁定」则按原逻辑。</div>
      </div>
    </div>

    <!-- MCP 服务编辑/新增弹窗:配置 name / url / 多条 headers / 单次调用超时 / 启用开关;保存后写入 config.yml,重启生效 -->
    <div id="mcp-edit-modal" class="modal-overlay hidden" onclick="if(event.target===this)mcpUI.close()">
      <div class="modal modal-wide">
        <button class="modal-close-btn" onclick="mcpUI.close()">
          <svg viewBox="0 0 24 24"><use href="#i-x-line-b"/></svg>
        </button>
        <h3 id="mce-title">编辑 MCP 服务</h3>
        <input type="text" id="mce-name" placeholder="服务名">
        <input type="text" id="mce-url" placeholder="MCP 服务 JSON-RPC URL">
        <!-- 内置服务预设字段（name 只读、url 可改，表单由预设生成） -->
        <div class="mpe-sec hidden" id="mce-preset-sec">
          <div class="mpe-sec-head"><span>配置参数</span><span class="cfg-note" id="mce-preset-desc"></span></div>
          <div id="mce-preset-fields"></div>
        </div>
        <div class="mpe-sec" id="mce-headers-sec">
          <div class="mpe-sec-head"><span>请求头(headers)</span><button class="ghost-btn sm" onclick="mcpUI.addHeader()">添加 header</button></div>
          <div id="mce-headers"></div>
        </div>
        <div class="mpe-sec">
          <label class="mpe-line"><span>单次调用超时</span>
            <span class="mpe-unit"><input type="number" id="mce-timeout" min="1000" max="600000" step="1000" placeholder="60000"><i>ms</i></span>
          </label>
          <label class="mpe-line"><span>工具暴露</span>
            <select id="mce-mode">
              <option value="advertise">advertise（下发给模型）</option>
              <option value="skill">skill（以技能形式暴露）</option>
              <option value="disable">disable（不加载）</option>
            </select>
          </label>
        </div>
        <div class="btn-row mpe-foot">
          <button class="ghost-btn danger hidden" id="mce-del-btn" onclick="mcpUI.del()">删除服务</button>
          <button class="primary-btn" onclick="mcpUI.save()">保存</button>
        </div>
      </div>
    </div>

    <!-- 定时任务详情弹窗：频次（预设控件组合 cron，无法识别的既有表达式落入自定义）+ 提示词（可改），动作：更新/删除。
         必须在 confirm-modal 之前：同为 z-index:100，DOM 靠后者叠在上，删除二次确认要盖住本窗 -->
    <div id="schedule-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeScheduleModal()">
      <div class="modal">
        <button class="modal-close-btn" onclick="closeScheduleModal()">
          <svg viewBox="0 0 24 24"><use href="#i-x-line-b"/></svg>
        </button>
        <h3 id="schedule-modal-title">定时任务</h3>
        <div class="sched-row">
          <select id="sched-freq" onchange="schedFreqUi()">
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="everyN">每隔</option>
            <option value="custom">自定义</option>
          </select>
          <select id="sched-dow" class="hidden">
            <option value="1">周一</option><option value="2">周二</option><option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option><option value="0">周日</option>
          </select>
          <input id="sched-hh" class="sched-num hidden" type="number" min="0" max="23" placeholder="时">
          <span id="sched-colon" class="hidden">:</span>
          <input id="sched-mm" class="sched-num hidden" type="number" min="0" max="59" placeholder="分">
          <input id="sched-nh" class="sched-num hidden" type="number" min="1" max="23">
          <span id="sched-nh-unit" class="hidden">小时</span>
          <input id="sched-cron" class="sched-grow hidden" type="text" placeholder="分 时 日 月 周（5 段 cron）">
        </div>
        <div class="sched-meta" id="sched-modal-meta"></div>
        <textarea id="sched-modal-prompt" rows="6" placeholder="每次触发时投递给本会话的提示词"></textarea>
        <div class="btn-row">
          <button class="ghost-btn danger" id="sched-del-btn" onclick="deleteSchedule()">删除</button>
          <button class="primary-btn" id="sched-save-btn" onclick="saveSchedule()">更新</button>
        </div>
      </div>
    </div>

    <!-- 全局确认弹窗(替代原生 confirm;搬自 index)。resolve: true=确定 / false=取消 / null=右上 X 或点遮罩关闭 -->
    <div id="confirm-modal" class="modal-overlay hidden" onclick="if(event.target===this)confirmClose(null)">
      <div class="modal">
        <button class="modal-close-btn" onclick="confirmClose(null)" aria-label="关闭">
          <svg viewBox="0 0 24 24"><use href="#i-x-line-b"/></svg>
        </button>
        <h3 id="confirm-title">请确认</h3>
        <div class="modal-text" id="confirm-text"></div>
        <label class="del-dir hidden" id="confirm-check-wrap"><input type="checkbox" id="confirm-check"> <span id="confirm-check-label"></span></label>
        <div class="btn-row">
          <button class="ghost-btn" id="confirm-cancel-btn" onclick="confirmClose(false)">取消</button>
          <button class="primary-btn" id="confirm-ok-btn" onclick="confirmClose(true)">确定</button>
        </div>
      </div>
    </div>

    <!-- 全局输入弹窗(替代原生 prompt;搬自 index) -->
    <div id="prompt-modal" class="modal-overlay hidden" onclick="if(event.target===this)promptCancel()">
      <div class="modal">
        <button class="modal-close-btn" onclick="promptCancel()">
          <svg viewBox="0 0 24 24"><use href="#i-x-line-b"/></svg>
        </button>
        <h3 id="prompt-title">请输入</h3>
        <input type="text" id="prompt-input">
        <div class="btn-row">
          <button class="ghost-btn" onclick="promptCancel()">取消</button>
          <button class="primary-btn" onclick="promptOk()">确定</button>
        </div>
      </div>
    </div>

    <!-- 已完成/已终止会话:选择模型继续(搬自 index;顶部动作区「切换模型」入口) -->
    <div id="bind-model-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeModelSwitch()">
      <div class="modal">
        <div class="msw-header">
          <div class="msw-titles">
            <h3>切换模型</h3>
            <p class="msw-sub" id="bind-model-sub">选择一个模型继续当前会话</p>
          </div>
          <button class="modal-close-btn" onclick="closeModelSwitch()">
            <svg viewBox="0 0 24 24"><use href="#i-x-line-b"/></svg>
          </button>
        </div>
        <div class="msw-list" id="bind-model-list"></div>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
  </div>

  <!-- 图片全屏查看器(点击消息/工具卡中图片打开;双指缩放、放大后可拖动;同组多图可左右滑动切换) -->
  <div id="img-viewer" class="hidden">
    <button class="fs-close" onclick="closeImageViewer()">✕</button>
    <img id="img-viewer-img" alt="">
    <!-- 组内页码(如 2 / 5):仅同组多图时显示 -->
    <span id="img-count" class="hidden"></span>
  </div>

  <!-- ================= 文档预览分栏(桌面端≥960px；紧贴左侧文件树:文件树 | 预览 | 会话；office/全部文档类型统一承载；移动端走全屏 #fs-viewer，本栏隐藏) -->
  <aside id="pv-pane" aria-label="文档预览">
    <header class="pv-head">
      <!-- 地址条胶囊：路径 input(点击全选可复制) + 内嵌 刷新/新窗口，模拟浏览器地址栏 -->
      <span class="pv-addr">
        <input class="pv-title" id="pv-title" aria-label="文件路径或网址">
        <button class="icon-btn hidden" id="pv-refresh" title="重新载入" aria-label="重新载入">
          <svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-refresh"/></svg>
        </button>
        <button class="icon-btn hidden" id="pv-popup" title="新窗口打开" aria-label="新窗口打开">
          <svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-external"/></svg>
        </button>
      </span>
      <span class="pv-actions">
        <!-- 源码钮：只在当前内容有源文本时出现（md/文本/代码/html/svg），点了在预览与原文间切换 -->
        <button class="icon-btn hidden" id="pv-src" title="查看源码" aria-label="查看源码">
          <svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-eye"/></svg>
        </button>
        <button class="icon-btn hidden" id="pv-download" title="下载文件" aria-label="下载文件">
          <svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-download"/></svg>
        </button>
        <button class="icon-btn" id="pv-max" title="放大" aria-label="放大">
          <svg class="ic sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-maximize"/></svg>
          <svg class="ic sm hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-minimize"/></svg>
        </button>
        <button class="icon-btn" id="pv-close" title="关闭预览" aria-label="关闭预览">✕</button>
      </span>
      <div class="pv-suggest hidden" id="pv-suggest"></div>
    </header>
    <div class="pv-body" id="pv-body"></div>
  </aside>

  <!-- 消息全屏查看器(双击气泡/工具卡打开;支持双指缩放) -->
  <div id="fs-viewer" class="hidden" onclick="if(event.target===this)closeFullscreen()">
    <!-- 顶部操作区:文件预览(fs-bar 模式)时独立成一行,内容从行下开始,不遮挡页面自己的顶部按钮;
         消息全屏时退化为右上角悬浮按钮簇。文件名仅栏模式显示。 -->
    <div class="fs-actions">
      <span class="fs-name" id="fs-file-name"></span>
      <!-- 源码切换钮:仅当当前内容有源文本时显隐(toggleFsSrc 在渲染视图/源码面板间互切) -->
      <button class="fs-btn hidden" id="fs-src-btn" title="显示源码" aria-label="显示源码">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-eye"/></svg>
      </button>
      <!-- 复制源码:显隐与 eye 一致(有源文本才出现);HTML/SVG/MD/代码通用 -->
      <button class="fs-btn hidden" id="fs-copy-btn" title="复制源码" aria-label="复制源码">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#i-copy"/></svg>
      </button>
      <button class="fs-btn" onclick="closeFullscreen()" title="关闭" aria-label="关闭">✕</button>
    </div>
    <div class="fs-panel" id="fs-body"></div>
    <div class="fs-panel fs-src-panel hidden" id="fs-src-pane"><pre id="fs-src-code"></pre></div>
  </div>

  <!-- 拖拽上传提示层:window 级 dragenter 时显示;pointer-events:none,不参与命中测试(逻辑见 js/files.js) -->
  <div id="drop-overlay" class="hidden" aria-hidden="true">
    <div class="drop-hint">
      <svg viewBox="0 0 24 24" class="ic"><use href="#i-upload-cloud"/></svg>
      <span>松开即可上传</span>
    </div>
  </div>

  <script src="/js/viewport.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/sessions.js"></script>
  <script src="/js/stream.js"></script>
  <script src="/js/files.js"></script>
  <script src="/js/voice.js"></script>
  <script src="/js/preview.js"></script>
  <script src="/js/vcs.js"></script>
  <script src="/js/files-tree.js"></script>
  <script src="/js/settings.js"></script>
  <script>
  // 启动自愈:外部工具改前端文件是非原子写入,极端时机下浏览器可能拿到半截或重复拼接的 HTML
  // (脚本缺半 → 白屏裸首页;重复注入 → 每个文件报 duplicate variable 后 JS 全挂)。
  // 这里检测关键脚本数量与入口全局,不对就自动整页重载一次(sessionStorage 防循环)。
  // 注意:js/ 脚本增减时需同步改这里的期望数 10。
  (function () {
    var ok = false;
    try {
      var n = document.querySelectorAll('script[src^="/js/"]').length;
      ok = n === 10 && typeof state !== 'undefined' &&
           typeof openFilePreview === 'function' && typeof restartNow === 'function';
    } catch (_) {}
    if (ok) { try { sessionStorage.removeItem('boot-heal'); } catch (_) {} return; }
    try {
      if (sessionStorage.getItem('boot-heal')) { sessionStorage.removeItem('boot-heal'); return; }
      sessionStorage.setItem('boot-heal', '1');
    } catch (_) { return; }
    location.reload();
  })();
  </script>
</body>
</html>
