<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agent 任务台</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <meta name="theme-color" content="#3964FE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agent">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
  <script>
    // 注册 Service Worker（PWA / 离线缓存）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch((err) => {
          console.warn('[SW] register failed:', err);
        });
      });
    }
  </script>
  </head>
<body>
  <div id="app">

    <!-- ================= 顶部导航栏 ================= -->
    <header class="header">
      <button class="icon-btn" id="menu-btn" title="历史记录" aria-label="打开历史记录">
        <svg viewBox="0 0 24 24" class="ic sm"><path stroke-width="2" stroke-linecap="round" d="M4 5h16M4 15h10"/></svg>
      </button>
      <div class="header-center" id="header-center"><!-- 未对话状态为空白,JS 注入对话信息 --></div>
      <button class="icon-btn hidden" id="new-chat-btn" title="新建对话" aria-label="新建对话">
        <svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </header>

    <!-- ================= 会话状态栏(搬自 index 的 phase-bar;仅在对话中显示) ================= -->
    <div id="phase-bar" class="phase-bar hidden">
      <span class="status-pill" id="status-pill">--</span>
      <button class="stop-link hidden" id="stop-btn" onclick="stopSession()">终止</button>
      <button class="stop-link muted hidden" id="model-switch-btn" onclick="openModelSwitch()">选择模型</button>
      <button class="stop-link hidden" id="clear-msg-btn" onclick="clearChat()">清空</button>
    </div>

    <main>
      <!-- ================= 未对话状态:模式切换区 ================= -->
      <section id="welcome-view">
        <div class="welcome-head">
          <div class="logo-badge">
            <svg class="ic" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"></rect><line x1="12" y1="4" x2="12" y2="8"></line><circle cx="12" cy="3" r="1.4"></circle><circle cx="9" cy="13.5" r="1" fill="currentColor" stroke="none"></circle><circle cx="15" cy="13.5" r="1" fill="currentColor" stroke="none"></circle><line x1="9.5" y1="17" x2="14.5" y2="17"></line></svg>
          </div>
          <div class="welcome-slog</title>an">选择模式开始对话</div>
        </div>

        <div class="mode-switch" role="tablist" id="mode-switch">
          <button class="mode-chip on" data-mode="secretary" role="tab" aria-selected="true">
            <svg class="ic sm" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 13L2 9z"></path><polyline points="2 9 22 9"></polyline><polyline points="10 3 8 9 12 22"></polyline><polyline points="14 3 16 9 12 22"></polyline></svg>
            文秘助理
          </button>
          <button class="mode-chip" data-mode="vision" role="tab" aria-selected="false">
            <svg class="ic sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            识图专家
          </button>
        </div>
        <div class="mode-hint" id="mode-hint"></div>
      </section>

      <!-- ================= 对话状态:对话内容区 ================= -->
      <section id="chat-view" class="hidden"></section>
    </main>

    <!-- ================= 底部输入区 ================= -->
    <footer>
      <div class="attach-chips hidden" id="attach-chips"></div>
      <div class="input-shell">
        <textarea id="msg-input" placeholder="传送信息" rows="2" enterkeyhint="send"></textarea>
        <div class="input-actions">
          <div class="ia-side ia-left">
            <button class="think-toggle" id="deep-think-btn" title="深度思考">
              <svg viewBox="0 0 24 24" class="ic sm"><path d="M12 10.2a1.8 1.8 0 1 0 0.001 3.6A1.8 1.8 0 0 0 12 10.2z"></path><path stroke-width="1.5" d="M15.76 15.76 C10.955 20.565 5.373 22.779 3.297 20.703 C1.22 18.627 3.434 13.045 8.24 8.24 C13.045 3.435 18.627 1.22 20.703 3.297 C22.779 5.374 20.565 10.955 15.76 15.76z"></path><path stroke-width="1.5" d="M16.096 7.904 C20.905 12.713 22.965 18.298 20.703 20.703 C18.44 23.108 13.003 20.755 8.24 15.76 C3.477 10.76 1.22 5.373 3.297 3.297 C5.374 1.22 10.955 3.434 16.096 7.904z"></path></svg>
              深度思考
            </button>
          </div>
          <div class="ia-side ia-right">
            <button class="plus-btn" id="attach-btn" title="任务文件" aria-label="任务文件">
              <svg viewBox="0 0 24 24" class="ic sm"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            </button>
            <button class="send-btn" id="send-btn" title="发送" aria-label="发送">
              <svg viewBox="0 0 24 24" class="ic sm"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
            </button>
          </div>
        </div>
      </div>
    </footer>

    <!-- 回到底部浮动按钮(搬自 index;上翻历史时出现、AI 输出中常驻转圈) -->
    <button class="scroll-bottom-btn hidden" id="scroll-bottom-btn" onclick="clickScrollBottom()" title="回到底部" aria-label="回到底部">
      <svg class="sb-arrow" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
      <svg class="sb-spinner hidden" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M22 12a10 10 0 0 1-10 10"></path></svg>
    </button>

    <!-- ================= 历史记录抽屉 ================= -->
    <div id="scrim"></div>
    <aside id="drawer" aria-label="对话历史">
      <div class="drawer-search">
        <div class="search-box">
          <svg class="ic sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="search" id="search-input" placeholder="搜寻对话内容..." enterkeyhint="search">
        </div>
      </div>
      <div class="drawer-list" id="drawer-list"></div>
      <div class="drawer-user" id="drawer-user">
        <div class="avatar" id="drawer-avatar">A</div>
        <div class="user-name" id="drawer-user-name">Agent 用户</div>
        <button class="user-more" id="user-more-btn" title="更多设置" aria-label="更多设置">
          <svg class="ic sm" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"></circle></svg>
        </button>
      </div>
    </aside>

    <!-- ================= 任务文件面板(浮层:点输入行右侧发送旁的附件按钮展开;盖住输入区+遮罩) ================= -->
    <div id="files-mask" aria-hidden="true"></div>
    <div class="files-panel" id="files-panel" aria-label="任务文件">
          <div class="files-panel-header">
            <span class="files-panel-title">任务文件</span>
            <label class="file-upload" title="上传文件" aria-label="上传文件">
              <input type="file" id="file-input" multiple hidden>
              <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
            </label>
          </div>
          <div class="files-list" id="files-list"></div>
                <div class="files-panel-progress hidden" id="fp-progress" aria-live="polite">
                  <div class="fp-track"><div class="bar" id="fp-progress-bar"></div></div>
                  <span class="pct" id="fp-progress-pct">0%</span>
                </div>
                <div class="files-panel-footer">
            <div class="files-panel-footer-left">
              <span class="file-check files-panel-check" id="files-toggle-all" role="checkbox" aria-checked="false" aria-label="全选" title="全选" tabindex="0"></span>
              <span class="files-panel-count" id="files-count">未选择文件</span>
            </div>
            <div class="files-panel-actions">
              <button class="files-fab" id="files-bulk-download" title="批量下载" aria-label="批量下载" disabled>
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              </button>
              <button class="files-fab del" id="files-bulk-delete" title="批量删除" aria-label="批量删除" disabled>
                <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
            </div>
          </div>
        </div>

    <!-- ================= 设置区(覆盖层;入口:侧边栏用户区) ================= -->
    <section id="settings-page" class="hidden" aria-label="设置">
      <!-- 垫底静态快照层:子页右滑返回时,父页快照垫在这里(仅动画背景,pointer-events:none;滑完重渲染真页) -->
      <div id="set-under" aria-hidden="true"></div>
      <!-- 当前页层:返回滑动只平移这一层,底下露出垫底的父页 -->
      <div id="set-top">
        <!-- 顶栏:左侧返回 + 中间标题 + 右侧操作按钮,风格与对话页 header 一致 -->
        <header class="header">
          <button class="icon-btn" id="set-back-btn" title="返回" aria-label="返回">
            <svg class="ic" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <div class="header-center"><div class="header-title" id="set-title">设置</div></div>
          <div class="header-right" id="set-actions"><!-- JS 按页注入操作按钮 --></div>
        </header>
        <div id="set-body"><!-- JS 按页渲染 --></div>
      </div>
    </section>

    <!-- 新建技能弹窗(搬自 index) -->
    <div id="skill-create-modal" class="modal-overlay hidden" onclick="if(event.target===this)sUI.closeCreate()">
      <div class="modal">
        <button class="modal-close-btn" onclick="sUI.closeCreate()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3>新建技能</h3>
        <input type="text" id="skill-new-name" placeholder="技能名(字母/数字/-/_)">
        <input type="text" id="skill-new-desc" placeholder="一句话描述(何时使用该技能)">
        <button class="primary-btn" onclick="sUI.createSkill()">创建</button>
      </div>
    </div>

    <!-- 模型编辑/新增弹窗(搬自 index) -->
    <div id="model-edit-modal" class="modal-overlay hidden" onclick="if(event.target===this)sUI.mClose()">
      <div class="modal">
        <button class="modal-close-btn" onclick="sUI.mClose()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3 id="moe-title">编辑模型</h3>
        <select id="moe-target"></select>
        <div id="moe-newkey-wrap" class="hidden">
          <select id="moe-nk-plat"></select>
          <input type="text" id="moe-nk-key" placeholder="api_key(留空则不带鉴权头)">
          <input type="number" id="moe-nk-con" min="1" step="1" value="1" placeholder="并发数 concurrency(默认 1)">
        </div>
        <div id="moe-newplat-wrap" class="hidden">
          <input type="text" id="moe-np-name" placeholder="平台名称(留空取域名主机段)">
          <input type="text" id="moe-np-url" placeholder="平台上游地址(OpenAI 兼容 /v1)">
          <input type="text" id="moe-np-type" value="" placeholder="类型(任意自定义;余额查询已接入:deepseek)">
          <input type="text" id="moe-np-key" placeholder="api_key(留空则不带鉴权头)">
          <input type="number" id="moe-np-con" min="1" step="1" value="1" placeholder="并发数 concurrency(默认 1)">
        </div>
        <input type="text" id="moe-name" placeholder="显示名(留空同 id)">
        <input type="text" id="moe-id" placeholder="id(上游模型名,全局唯一)">
        <label class="del-dir"><input type="checkbox" id="moe-vision">支持图片输入(vision)</label>
        <div class="btn-row">
          <button class="ghost-btn danger hidden" id="moe-del-btn" onclick="sUI.mDel()">删除</button>
          <button class="primary-btn" onclick="sUI.mSave()">保存</button>
        </div>
        <div class="cfg-note">写入 config.yml,到「服务」页重启服务后生效。id 不可在此修改(历史会话按 id 绑定),如需改动请编辑配置文件原文。</div>
      </div>
    </div>

    <!-- 全局确认弹窗(替代原生 confirm;搬自 index) -->
    <div id="confirm-modal" class="modal-overlay hidden" onclick="if(event.target===this)confirmClose(false)">
      <div class="modal">
        <h3 id="confirm-title">请确认</h3>
        <div class="modal-text" id="confirm-text"></div>
        <label class="del-dir hidden" id="confirm-check-wrap"><input type="checkbox" id="confirm-check"> <span id="confirm-check-label"></span></label>
        <div class="btn-row">
          <button class="ghost-btn" onclick="confirmClose(false)">取消</button>
          <button class="primary-btn" id="confirm-ok-btn" onclick="confirmClose(true)">确定</button>
        </div>
      </div>
    </div>

    <!-- 全局输入弹窗(替代原生 prompt;搬自 index) -->
    <div id="prompt-modal" class="modal-overlay hidden" onclick="if(event.target===this)promptCancel()">
      <div class="modal">
        <button class="modal-close-btn" onclick="promptCancel()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3 id="prompt-title">请输入</h3>
        <input type="text" id="prompt-input">
        <div class="btn-row">
          <button class="ghost-btn" onclick="promptCancel()">取消</button>
          <button class="primary-btn" onclick="promptOk()">确定</button>
        </div>
      </div>
    </div>

    <!-- 已完成/已终止会话:选择模型继续(搬自 index;phase-bar「选择模型」入口) -->
    <div id="bind-model-modal" class="modal-overlay hidden" onclick="if(event.target===this)closeModelSwitch()">
      <div class="modal">
        <button class="modal-close-btn" onclick="closeModelSwitch()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3>选择模型继续会话</h3>
        <p class="empty-tip" style="margin-bottom:10px">为已结束(已完成/已终止)的会话指定一个空闲模型，绑定后继续对话将优先使用该模型。</p>
        <div class="btn-row" id="bind-model-list" style="flex-direction:column;align-items:stretch;gap:8px;"></div>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
  </div>

  <!-- 图片全屏查看器(点击消息/工具卡中图片打开;双指缩放、放大后可拖动) -->
  <div id="img-viewer" class="hidden">
    <button class="fs-close" onclick="closeImageViewer()">✕</button>
    <img id="img-viewer-img" alt="">
  </div>

  <!-- 消息全屏查看器(双击气泡/工具卡打开;支持双指缩放) -->
  <div id="fs-viewer" class="hidden" onclick="if(event.target===this)closeFullscreen()">
    <button class="fs-close" onclick="closeFullscreen()">✕</button>
    <div class="fs-panel" id="fs-body"></div>
  </div>

  <script>
  /*
   * ============================================================================
   * Agent 任务台 v2 —— 接入真实后端(全部沿用 /api 现有接口,未新增任何接口)
   * ----------------------------------------------------------------------------
   * 已接入:
   *   GET    /api/sessions?status=active&limit=100             抽屉「今天/昨天」活跃列表
   *   GET    /api/sessions?status=done&limit=50&with_total=1   抽屉归档列表
   *   GET    /api/sessions?q=..&limit=50                       抽屉搜索
   *   POST   /api/sessions {title:'', model_id:''}             首条消息自动建档
   *   GET    /api/sessions/:id                                 打开会话(消息+文件)
   *   POST   /api/sessions/:id/messages {content, attachments} 发送消息
   *   POST   /api/sessions/:id/files                           附件上传(multipart)
   *   GET    /api/sessions/:id/stream                          SSE 流式输出
   *   POST   /api/sessions/:id/stop | /release                  状态栏「终止/断开」
   *   POST   /api/sessions/:id/bind {model_id}                  状态栏「选择模型」(已完成/已终止会话)
   *   DELETE /api/sessions/:id/messages                         状态栏「清空」(会话内删除已移除,清空由这里承担)
   *   DELETE /api/sessions/:id/messages/:messageId              删除单条消息/工具卡(删 assistant 连带工具回执;单删工具卡同步摘除父调用)
   *   GET    /api/models                                        状态栏「选择模型」弹窗模型列表
   *
   * 设置区(侧边栏用户区整行点击进入;页面搬自 index.html,未新增任何接口):
   *   GET    /api/system/status | POST /api/system/restart[?force=true]   服务·状态与重启
   *   GET/PUT/PATCH /api/config | POST /api/config/validate               系统配置 / 原文编辑 / 模型增删改
   *   GET    /api/models | GET /api/platforms/balance                     模型·模型池与余额
   *   GET/POST/PUT/DELETE /api/skills[/:name][/file|/upload|/rename]      技能·技能与文件管理
   *   GET    /api/me | POST /api/password | GET /logout                    账户·信息/改密/退出
   *
   * 后端已有但 v2 尚未接入 UI 的接口(先列出,不实现):
   *   PATCH  /api/sessions/:id                                重命名(后端已支持)
   *   GET    /api/sessions/:id/files/download-token?path=      文件下载(配合文件面板)
   *
   * 无后端支撑、仅前端占位的概念(先不实现):
   *   · 「文秘助理 / 识图专家」模式 —— 后端无 mode 字段,当前仅影响提示文案
   *   · 「思考过程」折叠块(已思考 N 秒) —— 后端不产出 reasoning,已移除 mock
   * 鉴权:任意请求 401 时跳转 /login(与 core.js 的 req 一致)。
   * ============================================================================
   */
  'use strict';

  // ---------- 工具 ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  // ---------- markdown 渲染(同步 index:marked CDN;缺失/异常时回退转义纯文本) ----------
  // 返回 { html, fmt }:fmt=false 表示未做转换,气泡不带 .md 类、保持 pre-wrap 原文排版
  if (typeof marked !== 'undefined') marked.setOptions({ breaks: true, gfm: true });
  function mdHtml(text) {
    if (typeof marked === 'undefined') return { html: esc(text), fmt: false };
    try { return { html: marked.parse(text || ''), fmt: true }; }
    catch (_) { return { html: esc(text), fmt: false }; }
  }
  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const p = n => String(n).padStart(2, '0');
    const now = new Date();
    const hm = p(d.getHours()) + ':' + p(d.getMinutes());
    if (now.toDateString() === d.toDateString()) return hm;
    const md = (d.getMonth() + 1) + '/' + d.getDate();
    return (d.getFullYear() === now.getFullYear() ? md : d.getFullYear() + '/' + md) + ' ' + hm;
  }
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.add('hidden'), 2000);
  }
  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
    } catch (_) { /* 落入降级 */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '-9999px'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (_) { return false; }
  }

  // ---------- API(与 core.js 的 req 保持一致) ----------
  async function req(method, url, body, isForm) {
    const opt = { method, headers: {} };
    if (body && !isForm) {
      opt.headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(body);
    } else if (body && isForm) {
      opt.body = body;
    }
    const res = await fetch(url, opt);
    if (res.status === 401) { location.href = '/login'; throw new Error('未登录'); }
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { msg = (await res.json()).error || msg; } catch (_) {}
      const err = new Error(msg);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  // ---------- 模式配置（新增助手类型时只需在这里加一项，welcome 卡片与顶部 icon 会自动跟随） ----------

    },
    vision: {

    },

  // ---------- 全局状态 ----------
  const state = {

    sessionType: 'secretary',   // 当前会话的助手类型（建档时锁定，后续不随模式切换变更）
    deepThink: false,           // 深度思考开关(仅本地视觉状态,无后端参数)
    sessionId: null,            // 当前会话

    sessions: [],               // 抽屉列表缓存

    lastImgBlobUrl: null,       // 任务文件图片预览的 blob URL，下次预览或开新图时回收
    es: null,                   // EventSource
    streamText: '',             // 当前流式累积文本
    streamEl: null,             // 当前流式 AI 气泡
    streamWrap: null,           // 当前流式消息容器（.msg.other）；思考面板与气泡都挂它上面
    streamReasoning: '',        // 当前流式累积思考文本
    streamThinkEl: null,        // 当前流式思考面板的 body 节点（未出现思考时为 null）

  // ---------- 视图切换 ----------
  function setView(view) {

    $('welcome-view').classList.toggle('hidden', view !== 'welcome');

  function renderHeader() {

    // 顶部 icon 跟随会话自身的助手类型（而非 welcome 当前选中项）

  // ---------- 模式切换区 ----------
  function selectMode(mode) {

    for (const chip of document.querySelectorAll('.mode-chip')) {

  // ---------- 消息渲染 ----------
  // 服务端把附件说明拼在正文前(【系统通知】用户上传了文件：...),此处拆开单独展示 📎 行
  function parseUploadNotice(content) {
    const m = /^【系统通知】用户上传了文件：([^\n]*)(?:\n([\s\S]*))?$/.exec(content || '');
    if (!m) return { text: content || '', files: null };
    const files = m[1].split('、').map(s => s.replace(/（大小[^）]*）$/, '').trim()).filter(Boolean);
    return { text: m[2] || '', files: files };
  }

  function actionsHtml(ts, content, msgId) {
    const b64 = btoa(unescape(encodeURIComponent(content)));
    // 删除本条:仅已落库消息可删(传 m.id);流式未落库时无 id,不渲染
    const del = msgId
      ? '<button class="act act-del" title="删除本条" data-msg-id="' + msgId + '">' +
        '<svg class="ic sm" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>' +
        '</button>'
      : '';
    return '<div class="msg-actions">' +
      '<span>' + fmtTime(ts) + '</span>' +
      '<button class="act act-copy" title="复制" data-b64="' + b64 + '">' +
        '<svg class="ic sm" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>' +
      '</button>' +
      del +
    '</div>';
  }

  function userMsgHtml(m) {
    const p = parseUploadNotice(m.content);
    const attach = p.files && p.files.length
      ? '<div class="attach-line">📎 ' + esc(p.files.join('、')) + '</div>' : '';
    const r = mdHtml(p.text);
    // 复制内容取纯文本（不含【系统通知】附件行），与气泡里显示一致
    return '<div class="msg me">' +
      '<div class="bubble-user' + (r.fmt ? ' md' : '') + '">' + attach + r.html + '</div>' +
      actionsHtml(m.created_at, p.text, m.id) +
    '</div>';
  }

  function aiMsgHtml(m) {
    const text = (m.content || '').trim();
    const reason = (m.reasoning || '').trim();
    if (!text && !reason) return null; // 纯工具调用的应答:不渲染气泡,工具卡由 appendToolCardsFromAssistant 铺
    const think = reason ? thinkPanelHtml(m.reasoning) : '';
    const bubble = text ? (() => { const r = mdHtml(m.content); return '<div class="bubble-ai' + (r.fmt ? ' md' : '') + '">' + r.html + '</div>'; })() : '';
    return '<div class="msg other">' + think + bubble + actionsHtml(m.created_at, m.content || '', m.id) + '</div>';
  }
  // 思考过程折叠面板:summary 固定名「思考过程」,body 展示推理全文
  function thinkPanelHtml(text) {
    return '<details class="msg-think"><summary>思考过程</summary><div class="msg-think-body">' + esc(text) + '</div></details>';
  }

  // ---------- 工具调用卡片(样式/交互同步 index;流式与历史共用) ----------
  function toolArgsSummary(name, argsStr) {
    let s = '';
    try {
      const o = JSON.parse(argsStr || '{}');
      const key = ['path', 'command', 'regex', 'glob', 'url', 'query', 'source_path', 'destination_path'];
      for (const k of key) if (o[k]) { s = String(o[k]); break; }
      if (!s) s = argsStr || '';
    } catch (_) { s = argsStr || ''; }
    if (s.length > 80) s = s.slice(0, 80) + '…';
    return s;
  }
  function toolArgsFull(argsStr) {
    try { return JSON.stringify(JSON.parse(argsStr || '{}'), null, 2); }
    catch (_) { return argsStr || ''; }
  }
  function toolCopyBtnHtml(text) {
    if (!text) return '';
    const b64 = btoa(unescape(encodeURIComponent(text)));
    return '<button class="act act-copy" title="复制工具输出" data-b64="' + b64 + '">' +
      '<svg class="ic sm" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>';
  }
  // 工具卡「删除本条」：删的是 tool 消息行；后端会把它在父 assistant 里的调用同步摘除。
  // msgId = tool 消息的库行 id（历史渲染传 m.id；实时由 tool_result 事件的 msg_id 携带）
  function toolDelBtnHtml(msgId) {
    if (!msgId) return '';
    return '<button class="act act-del" title="删除本条" data-msg-id="' + msgId + '">' +
      '<svg class="ic sm" viewBox="0 0 24 24"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>';
  }
  function renderToolCard(id, name, argsStr, createdAt) {
    const div = document.createElement('div');
    div.className = 'tool-card';
    div.id = 'tool-' + id;
    div.innerHTML =
      '<details><summary><span class="spin">◌</span>' +
      '<span class="tool-name">' + esc(name) + '</span>' +
      '<span class="tool-args">' + esc(toolArgsSummary(name, argsStr)) + '</span></summary>' +
      '<pre class="tool-args-full">' + esc(toolArgsFull(argsStr)) + '</pre>' +
      '<pre class="tool-result">执行中…</pre>' +
      // 时间行/复制按钮在折叠体内:展开卡片才可见
      '<div class="tool-time">' + fmtTime(createdAt || Date.now()) + '</div></details>';
    return div;
  }
  // tool 消息 content:纯文本,或含图片时的哨兵 JSON {"__blocks__":[...]}(read_file 读图回传)
  function parseToolContent(content) {
    if (typeof content === 'string' && content.startsWith('{"__blocks__":')) {
      try {
        const blocks = JSON.parse(content).__blocks__ || [];
        const img = blocks.find(b => b.type === 'image_url');
        return {
          text: blocks.filter(b => b.type === 'text').map(b => b.text).join('\n'),
          imageUrl: img && img.image_url && img.image_url.url || null,
        };
      } catch (_) { /* 解析失败按原文显示 */ }
    }
    return { text: content, imageUrl: null };
  }
  function fillToolResult(id, content, isError, liveImageUrl, msgId) {
    const card = document.getElementById('tool-' + id);
    if (!card) return;
    if (isError) card.classList.add('error');
    card.querySelector('.spin').textContent = isError ? '✕' : '✓';
    const parsed = parseToolContent(content);
    const pre = card.querySelector('.tool-result');
    if (!pre) return;
    pre.textContent = parsed.text || '(空)';
    // 结果就绪后在卡片时间行补复制/删除按钮(删除走统一的 .act-del 委托)
    const timeRow = card.querySelector('.tool-time');
    if (timeRow) {
      if (msgId) card.dataset.msgId = msgId; // 记住 tool 消息行 id,多次回填不丢
      if (!timeRow.querySelector('.act-copy')) {
        timeRow.insertAdjacentHTML('beforeend', toolCopyBtnHtml(parsed.text || ''));
      }
      if (!timeRow.querySelector('.act-del')) {
        timeRow.insertAdjacentHTML('beforeend', toolDelBtnHtml(card.dataset.msgId));
      }
    }
    const img = liveImageUrl || parsed.imageUrl;
    if (img && !card.querySelector('.tool-img')) {
      const el = document.createElement('img');
      el.className = 'tool-img';
      el.src = img;
      el.title = '点击放大查看';
      pre.insertAdjacentElement('afterend', el);
    }
  }
  // 把 assistant 消息里的 tool_calls 建成工具卡片(历史渲染与 assistant_message 事件共用)
  function appendToolCardsFromAssistant(m, container) {
    if (!m.tool_calls) return;
    let calls;
    try { calls = typeof m.tool_calls === 'string' ? JSON.parse(m.tool_calls) : m.tool_calls; } catch (_) { return; }
    for (const c of calls) {
      const id = c.id || ('c' + Math.random().toString(36).slice(2, 10));
      if (state.toolCards[id]) continue; // tool_call 事件已经建过同一张卡,不重复创建
      const card = renderToolCard(id, c.function && c.function.name || '工具', c.function && c.function.arguments, m.created_at);
      container.appendChild(card);
      state.toolCards[id] = card;
    }
  }

  function msgNode(m) {
    if (m.role === 'user') return userMsgHtml(m);
    if (m.role === 'assistant') return aiMsgHtml(m);
    return null; // tool 结果不单独展示
  }

  function renderDetail(detail) {
    const s = detail.session;
    state.sessionTitle = (s && s.title) || '';
    state.sessionType = (s && s.assistant_type) || 'secretary'; // 顶部 icon 跟随会话类型
    state.status = (s && s.status) || '';
    state.toolCards = {};
    userPaused = false;
    removeTyping();
    renderHeader();
    updatePhaseBar({ model_id: s && s.model_id, queue_pos: detail.queue_pos });
    const box = $('chat-view');
    box.innerHTML = '';
    for (const m of detail.messages || []) {
      const node = msgNode(m);
      if (node) box.insertAdjacentHTML('beforeend', node);
      if (m.role === 'assistant') appendToolCardsFromAssistant(m, box);
      else if (m.role === 'tool' && m.tool_call_id) fillToolResult(m.tool_call_id, m.content, false, undefined, m.id);
    }
    if (!(detail.messages || []).length) {
      box.innerHTML = '<div class="drawer-empty">描述你的需求，AI 会和你讨论并直接干活。</div>';
    }
    scrollBottom();
    updateScrollBottomBtn();
  }

  function appendUserMsg(content, fileNames, msgId) {
    const attach = fileNames && fileNames.length
      ? '<div class="attach-line">📎 ' + esc(fileNames.join('、')) + '</div>' : '';
    const r = mdHtml(content);
    const wrap = document.createElement('div');
    wrap.className = 'msg me';
    wrap.innerHTML = '<div class="bubble-user' + (r.fmt ? ' md' : '') + '">' + attach + r.html + '</div>' +
      actionsHtml(Date.now(), content, msgId);
    $('chat-view').appendChild(wrap);
    scrollBottom();
  }

  // ---------- 滚动跟随(同步 index:上翻历史自动暂停跟随;右下角浮动钮可回底/转圈) ----------
  const SCROLL_BOTTOM_THRESHOLD = 80; // 距底 80px 内视为「在底部」
  function isNearBottom() {
    const box = $('chat-view');
    return box.scrollHeight - box.scrollTop - box.clientHeight < SCROLL_BOTTOM_THRESHOLD;
  }
  function scrollBottom() {
    const box = $('chat-view');
    box.scrollTop = box.scrollHeight;
  }
  // 仅当用户贴近底部且未主动暂停时才自动滚动(AI 内容增量到达)
  let userPaused = false;
  function maybeAutoScroll() {
    if (!userPaused && isNearBottom()) scrollBottom();
  }
  // AI 是否「正在干活」:流式输出中,或会话处于 active(含工具执行与多轮模型调用的间隙)
  function scrollBusy() { return state.streaming || state.status === 'active'; }
  function updateScrollBottomBtn() {
    const btn = $('scroll-bottom-btn');
    if (!btn) return;
    const inChat = state.view === 'chat' && !!state.sessionId;
    const busy = inChat && scrollBusy();
    // 运行中即使贴着底部也保持显示:转圈即「AI 还活着」指示,多轮工具间隙不至于看着像挂掉
    const show = busy || (inChat && !isNearBottom());
    btn.classList.toggle('hidden', !show);
    const spinner = btn.querySelector('.sb-spinner');
    if (spinner) spinner.classList.toggle('hidden', !busy);
    const arrow = btn.querySelector('.sb-arrow');
    if (arrow) arrow.classList.toggle('hidden', !!busy);
  }
  function clickScrollBottom() {
    userPaused = false;
    scrollBottom();
    updateScrollBottomBtn();
  }
  // 监听用户滚动意图:向上翻阅历史(滚轮向上/手指下拖)立即暂停跟随,回到底部时恢复。
  // 关键:用 wheel/touchmove 捕获「用户主动向上」的意图(程序滚动不会触发这二者),
  // 避免被自动跟随的 scrollBottom 反复拉回底部而无法上翻。
  function bindChatScroll() {
    const box = $('chat-view');
    let touchY = 0;
    box.addEventListener('wheel', e => { if (e.deltaY < 0) userPaused = true; }, { passive: true });
    box.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
    box.addEventListener('touchmove', e => {
      const dy = e.touches[0].clientY - touchY;
      if (dy > 3) userPaused = true;
      touchY = e.touches[0].clientY;
    }, { passive: true });
    box.addEventListener('scroll', () => {
      if (isNearBottom()) userPaused = false;
      updateScrollBottomBtn();
    }, { passive: true });
  }

  function addTyping() {
    removeTyping();
    const ph = document.createElement('div');
    ph.className = 'msg other';
    ph.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
    $('chat-view').appendChild(ph);
    state.typingEl = ph;
    scrollBottom();
  }
  function removeTyping() {
    if (state.typingEl) { state.typingEl.remove(); state.typingEl = null; }
  }

  // ---------- 会话列表(抽屉) ----------
  function groupLabel(ts) {
    const d = new Date(ts), n = new Date();
    const sod = t => new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
    const diff = (sod(n) - sod(d)) / 86400000;
    if (diff <= 0) return '今天';
    if (diff === 1) return '昨天';
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
  }

  // 抽屉行状态指示:仅进行中的会话(排队/活跃/保持)展示彩色圆点,已完成/已终止不显示
  const DRAWER_STATUS_TEXT = { queued: '排队中', active: '活跃中', held: '保持中' };
  function drawerStatusDot(s) {
    const st = s && s.status;
    const label = DRAWER_STATUS_TEXT[st];
    if (!label) return '';
    return '<span class="st-dot ' + esc(st) + '" aria-label="' + label + '"></span>';
  }

  function renderDrawerList() {
    const list = state.sessions.slice().sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
    const box = $('drawer-list');
    if (!list.length) { box.innerHTML = '<div class="drawer-empty">没有找到相关对话</div>'; return; }
    let html = '', lastGroup = null;
    for (const s of list) {
      const g = groupLabel(s.updated_at);
      if (g !== lastGroup) { html += '<div class="group-label">' + esc(g) + '</div>'; lastGroup = g; }
      html += '<div class="conv-wrap">' +
        '<button class="conv-item' + (s.id === state.sessionId ? ' active' : '') + '" data-id="' + esc(s.id) + '">' +
          '<span class="conv-title">' + esc(s.title || s.id) + '</span>' + drawerStatusDot(s) +
        '</button>' +
        '<button class="conv-del" data-del="' + esc(s.id) + '" title="删除会话" aria-label="删除会话">' +
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>' +
        '</button>' +
      '</div>';
    }
    box.innerHTML = html;
  }

  async function loadSessionList() {
    const q = $('search-input').value.trim();
    try {
      let list;
      if (q) {
        const r = await req('GET', '/api/sessions?q=' + encodeURIComponent(q) + '&limit=50&with_total=1');
        list = r.rows || [];
      } else {
        const [active, done] = await Promise.all([
          req('GET', '/api/sessions?status=active&limit=100'),
          req('GET', '/api/sessions?status=done&limit=50&with_total=1'),
        ]);
        list = (active || []).concat((done && done.rows) || []);
      }
      state.sessions = list;
      renderDrawerList();
    } catch (e) { toast('加载会话失败:' + e.message); }
  }

  // ---------- 会话打开 / 新建 / 状态栏(抽屉行 × 调 deleteSession; 默认含任务目录) ----------
  async function deleteSession(id) {
    if (!id) return;
    // 从已加载列表查出会话标题,让 modal 能显示「标题 + ID」方便核对
    const s = (state.sessions || []).find(x => x.id === id);
    const title = s ? (s.title || s.id) : id;
    const body = '确定删除会话 <b>「' + esc(title) + '」</b> 吗？删除后无法恢复。' +
      '<div class="confirm-sub">会话 ID：' + esc(id) + '</div>';
    if (!await confirmModal('删除会话', body, '删除', true,
        { checkbox: { label: '同时删除任务文件夹', default: true }, bodyHtml: true })) return;
    const delDir = state._confirmChecked ? 'true' : 'false';
    try {
      await req('DELETE', '/api/sessions/' + id + '?delete_dir=' + delDir);
      // 删的是当前打开的会话:回 welcome 视图并清状态
      if (state.sessionId === id) {
        closeStream();
        removeTyping();
        state.sessionId = null;
        state.sessionTitle = '';
        state.sessionType = 'secretary';
        state.streamEl = null;
        state.streamText = '';
        state.toolCards = {};
        state.streaming = false;
        setView('welcome'); // 复用 newChat 同样的视图切换路径
      }
      toast('已删除会话');
      loadSessionList();
    } catch (e) { toast('删除失败:' + e.message); }
  }
  function closeStream() {
    if (state.es) { state.es.close(); state.es = null; }
  }

  async function openSession(id) {
    closeStream();
    removeTyping();
    setFilesPanel(false); // 会话切换,收起文件面板防旧列表残留
    state.sessionId = id;
    state.status = '';
    // 先从抽屉列表缓存取会话类型，让顶部 icon 立即正确；详情回来后由 renderDetail 纠正
    const cached = (state.sessions || []).find(x => x.id === id);
    state.sessionType = (cached && cached.assistant_type) || 'secretary';
    state.streamEl = null;
    state.streamText = '';
    state.toolCards = {};
    state.streaming = false;
    state.attachments = [];
    userPaused = false;
    renderAttachChips();
    renderDrawerList(); // 会话切换后立刻重画抽屉高亮,避免下次打开才看到更新
    setView('chat');
    $('chat-view').innerHTML = '<div class="drawer-empty">加载中…</div>';
    try {
      const detail = await req('GET', '/api/sessions/' + id);
      if (state.sessionId !== id) return; // 期间已切到别的会话
      renderDetail(detail);
      connectStream();
    } catch (e) {
      if (state.sessionId === id) toast('打开会话失败:' + e.message);
    }
  }

  // 确保存在当前会话:首条消息自动建档(POST /api/sessions)；助手类型此时锁定，后续不可变更
  async function ensureSession() {
    if (state.sessionId) return state.sessionId;
    const s = await req('POST', '/api/sessions', { title: '', model_id: '', assistant_type: state.mode });
    state.sessionId = s.id;
    state.sessionTitle = (s && s.title) || '';
    state.sessionType = (s && s.assistant_type) || state.mode;
    setView('chat');
    renderHeader();
    updatePhaseBar();
    connectStream();
    return s.id;
  }

  function newChat() {
    closeStream();
    removeTyping();
    setFilesPanel(false); // 新建会话,文件面板随之收起
    state.sessionId = null;
    state.sessionTitle = '';
    state.sessionType = 'secretary';
    state.status = '';
    state.attachments = [];
    state.streamEl = null;
    state.streamText = '';
    state.toolCards = {};
    state.streaming = false;
    userPaused = false;
    renderAttachChips();
    selectMode('secretary'); // 置顶逻辑:新建时自动选中【文秘助理】
    setView('welcome');
    $('chat-view').innerHTML = '';
    $('msg-input').value = '';
    autosize();
    updateScrollBottomBtn();
  }

  // ---------- 会话重命名(点击 header 标题触发;PATCH 接口,同步 index 交互) ----------
  async function renameSession() {
    if (!state.sessionId) return;
    const cur = state.sessionTitle || state.sessionId;
    // 标题与 id 相同时(未命名)输入框留空
    const t = await promptModal('重命名会话', '输入新的会话名称', cur === state.sessionId ? '' : cur);
    if (t === null) return; // 取消
    const title = String(t).trim();
    try {
      await req('PATCH', '/api/sessions/' + state.sessionId, { title: title });
      toast('已重命名');
      state.sessionTitle = title;
      renderHeader();
      loadSessionList();
    } catch (e) { toast('重命名失败:' + e.message); }
  }

  // ---------- 会话状态栏(搬自 index 的 phase-bar 功能) ----------
  function updatePhaseBar(d) {
    const bar = $('phase-bar');
    if (!bar) return;
    if (!(state.view === 'chat' && state.sessionId)) { bar.classList.add('hidden'); return; }
    bar.classList.remove('hidden');
    const pill = $('status-pill');
    const stMap = { queued: '排队中', active: '活跃中', held: '保持中', completed: '已完成', cancelled: '已终止' };
    let text = stMap[state.status] || state.status || '--';
    if (d && d.queue_pos) text += '(第 ' + d.queue_pos + ' 位)';
    // active/held 时附带当前占用的模型
    if ((state.status === 'active' || state.status === 'held') && d && d.model_id) {
      text += ' · ' + d.model_id;
    }
    pill.textContent = text;
    // 状态胶囊配色:活跃中绿(执行中)、保持中黄(已答完、保持模型中)等;状态栏整体同步染色
    pill.className = 'status-pill ' + (state.status || '');
    bar.className = 'phase-bar ' + (state.status || '');
    // 活跃中提供「终止」;保持中改为「断开」(主动放弃保持租约,会话结为已完成)
    const btn = $('stop-btn');
    const actionable = state.status === 'active' || state.status === 'held';
    btn.classList.toggle('hidden', !actionable);
    btn.textContent = state.status === 'held' ? '断开' : '终止';
    btn.classList.toggle('muted', state.status === 'held');
    // 已完成/已终止时提供「选择模型」,手动指定空闲模型后继续对话
    const msBtn = $('model-switch-btn');
    if (msBtn) msBtn.classList.toggle('hidden', !(state.sessionId && (state.status === 'completed' || state.status === 'cancelled')));
    // 执行中(active)不提供「清空」——运行回合内删除历史会破坏上下文;其余状态(含排队中)可清空
    const clrBtn = $('clear-msg-btn');
    if (clrBtn) clrBtn.classList.toggle('hidden', !(state.sessionId && state.status && state.status !== 'active'));
  }
  async function stopSession() {
    if (!state.sessionId) return;
    const held = state.status === 'held';
    try {
      if (held) {
        await req('POST', '/api/sessions/' + state.sessionId + '/release');
        toast('已断开,模型已释放');
      } else {
        await req('POST', '/api/sessions/' + state.sessionId + '/stop');
        toast('已发送终止指令');
      }
    } catch (e) { toast((held ? '断开失败:' : '终止失败:') + e.message); }
  }
  async function openModelSwitch() {
    if (!state.sessionId) return;
    const list = $('bind-model-list');
    list.innerHTML = '<div class="empty-tip">加载中…</div>';
    $('bind-model-modal').classList.remove('hidden');
    try {
      const rows = await req('GET', '/api/models');
      if (!rows.length) {
        list.innerHTML = '<div class="empty-tip">还没有配置模型。</div>';
        return;
      }
      list.innerHTML = rows.map(m => m.is_busy
        ? '<button class="ghost-btn" disabled>' + esc(m.display_name || m.id) + ' · 占用中</button>'
        : '<button class="primary-btn" onclick="bindModel(\'' + esc(m.id) + '\')">' + esc(m.display_name || m.id) + '</button>').join('');
    } catch (e) {
      list.innerHTML = '<div class="empty-tip">读取模型列表失败:' + e.message + '</div>';
    }
  }
  function closeModelSwitch() { $('bind-model-modal').classList.add('hidden'); }
  async function bindModel(modelId) {
    if (!state.sessionId) return;
    const id = state.sessionId;
    closeModelSwitch();
    try {
      await req('POST', '/api/sessions/' + id + '/bind', { model_id: modelId });
      toast('已绑定模型 ' + modelId);
    } catch (e) { toast('绑定失败:' + e.message); }
    // 无论成败都刷新会话详情(失败多为并发占用,状态可能已变)
    try {
      const detail = await req('GET', '/api/sessions/' + id);
      if (state.sessionId === id) { renderDetail(detail); connectStream(); }
      loadSessionList();
    } catch (_) {}
  }
  async function clearChat() {
    if (!state.sessionId) return;
    const id = state.sessionId;
    const ok = await confirmModal('清空会话内容',
      '将删除本会话的全部聊天记录,AI 后续对话不再携带这段历史(从零开始,更省 token)。任务文件全部保留,不受影响。此操作不可恢复。',
      '清空', true);
    if (!ok) return;
    try {
      await req('DELETE', '/api/sessions/' + id + '/messages');
      toast('会话内容已清空,文件已保留');
      // 服务端已将会话收尾为 completed 并清空消息(不再预置会话上下文):重新拉取详情即为干净起点
      const detail = await req('GET', '/api/sessions/' + id);
      if (state.sessionId === id) { renderDetail(detail); connectStream(); }
      loadSessionList();
    } catch (e) { toast('清空失败:' + e.message); }
  }

  // ---------- 发送 ----------
  async function uploadFiles(sessionId, files) {
    const fd = new FormData();
    for (const f of files) fd.append('files', f.file, f.name);
    const r = await req('POST', '/api/sessions/' + sessionId + '/files', fd, true);
    return (r.uploaded || []).map(u => ({ name: u.filename, size: u.size }));
  }

  async function send() {
    const ta = $('msg-input');
    const content = ta.value.trim();
    if (!content && !state.attachments.length) return;

    const pending = state.attachments.slice();
    state.attachments = [];
    renderAttachChips();
    ta.value = '';
    autosize();

    try {
      const id = await ensureSession();
      let atts = [];
      if (pending.length) atts = await uploadFiles(id, pending);
      const body = { content, deepThink: !!state.deepThink };
      if (atts.length) body.attachments = atts;
      const sent = await req('POST', '/api/sessions/' + id + '/messages', body);

      appendUserMsg(content, atts.map(a => a.name), sent && sent.message_id);
      if (!state.sessionTitle && content) {
        state.sessionTitle = content.length > 24 ? content.slice(0, 24) : content;
      }
      renderHeader();
      addTyping();
      loadSessionList();
    } catch (e) {
      // 发送失败:附件还原,交由用户决定重试或移除
      state.attachments = pending.concat(state.attachments);
      renderAttachChips();
      toast('发送失败:' + e.message);
    }
  }

  // ---------- SSE 流 ----------
  // 助手消息流式容器：首个 delta 到达时创建，同时为思考面板预留挂载点
  function ensureStreamWrap() {
    if (state.streamWrap) return state.streamWrap;
    const wrap = document.createElement('div');
    wrap.className = 'msg other';
    const bubble = document.createElement('div');
    bubble.className = 'bubble-ai';
    wrap.appendChild(bubble);
    $('chat-view').appendChild(wrap);
    state.streamWrap = wrap;
    state.streamEl = bubble;
    return wrap;
  }
  // 思考面板:首次思考 delta 到达时创建,带 open 状态（流式中默认展开）
  function ensureStreamThinkPanel() {
    if (state.streamThinkEl) return state.streamThinkEl;
    if (!state.streamWrap) ensureStreamWrap();
    const det = document.createElement('details');
    det.className = 'msg-think streaming';
    det.open = true; // 流式阶段默认展开，看思考增量
    const sum = document.createElement('summary');
    sum.textContent = '思考过程';
    const body = document.createElement('div');
    body.className = 'msg-think-body';
    det.appendChild(sum);
    det.appendChild(body);
    // 插在气泡之前（思考 → 结论 的顺序）
    state.streamWrap.insertBefore(det, state.streamEl);
    state.streamThinkEl = body;
    return body;
  }

  function connectStream() {
    closeStream();
    if (!state.sessionId) return;
    const es = new EventSource('/api/sessions/' + state.sessionId + '/stream');
    state.es = es;
    es.addEventListener('status', ev => {
      const d = JSON.parse(ev.data);
      state.status = d.status;
      renderHeader();
      updatePhaseBar(d);
      updateScrollBottomBtn(); // 状态切换同步右下角转圈(开始/结束干活)
    });
    es.addEventListener('assistant_delta', ev => {
      const d = JSON.parse(ev.data);
      removeTyping();
      state.streamText += d.text;
      if (!state.streamEl) {
        if (!state.streamText.trim()) return; // 忽略前导空白(纯工具调用回合无文本)
        ensureStreamWrap();
        state.streamText = d.text; // 上面 if 已 trim 为非空
      }
      state.streamEl.textContent = state.streamText;
      state.streaming = true;
      maybeAutoScroll();
      updateScrollBottomBtn();
    });
    es.addEventListener('reasoning_delta', ev => {
      const d = JSON.parse(ev.data);
      removeTyping();
      state.streamReasoning += d.text;
      if (!state.streamWrap) ensureStreamWrap();
      ensureStreamThinkPanel();
      state.streamThinkEl.textContent = state.streamReasoning;
      state.streaming = true;
      maybeAutoScroll();
      updateScrollBottomBtn();
    });
    es.addEventListener('assistant_message', ev => {
      const d = JSON.parse(ev.data);
      removeTyping();
      const hasText = !!(d.content && d.content.trim());
      const r = hasText ? mdHtml(d.content) : null;
      // 思考面板：本轮结束时锁定为后端返回的完整文本（不清空 streamReasoning 以防与历史回填不一致）
      if (d.reasoning && d.reasoning.trim()) {
        if (!state.streamWrap) ensureStreamWrap();
        ensureStreamThinkPanel();
        state.streamThinkEl.textContent = d.reasoning;
      }
      if (state.streamEl) {
        if (r) {
          state.streamEl.className = 'bubble-ai' + (r.fmt ? ' md' : ''); // 增量期间是纯文本,收尾统一换 md 排版
          state.streamEl.innerHTML = r.html;
        } else {
          // 无文本时去掉气泡（纯工具调用/纯思考也要保留思考面板）
          state.streamEl.remove();
        }
        state.streamEl = null;
        state.streamText = '';
      } else if (r) {
        // 没起过气泡但收到文本：现在才创建（思考先行、文本后到的罕见场景）
        if (!state.streamWrap) ensureStreamWrap();
        const bubble = document.createElement('div');
        bubble.className = 'bubble-ai' + (r.fmt ? ' md' : '');
        bubble.innerHTML = r.html;
        state.streamWrap.appendChild(bubble);
      }
      if (d.tool_calls) appendToolCardsFromAssistant(d, $('chat-view'));
      state.streaming = false;
      // 思考面板默认折叠，避免挡着后续气泡；点击展开
      if (state.streamWrap) {
        const t = state.streamWrap.querySelector('.msg-think');
        if (t && t.open) t.open = false;
      }
      state.streamWrap = null;
      state.streamReasoning = '';
      state.streamThinkEl = null;
      maybeAutoScroll();
      updateScrollBottomBtn();
    });
    es.addEventListener('tool_call', ev => {
      const d = JSON.parse(ev.data);
      removeTyping(); // 工具卡出现也算即时反馈
      if (state.toolCards[d.id]) return; // assistant_message 已建卡(含完整参数),不重复创建
      const card = renderToolCard(d.id, d.name, d.arguments, Date.now());
      $('chat-view').appendChild(card);
      state.toolCards[d.id] = card;
      maybeAutoScroll();
    });
    es.addEventListener('tool_result', ev => {
      const d = JSON.parse(ev.data);
      fillToolResult(d.tool_call_id, d.content, d.is_error, d.image_url, d.msg_id);
      maybeAutoScroll();
    });
    es.addEventListener('done', ev => {
      removeTyping(); // 本轮结束,占位兼终止(如模型报错无回复)
      state.streaming = false;
      state.streamEl = null; // 防御性清理:回合异常结束(如终止)时不留悬空气泡到下一轮
      state.streamText = '';
      state.streamWrap = null;
      state.streamReasoning = '';
      state.streamThinkEl = null;
      state.toolCards = {};
      updateScrollBottomBtn();
      loadSessionList();
    });
    es.addEventListener('error', ev => {
      removeTyping();
      try {
        const d = JSON.parse(ev.data);
        if (d && d.message) toast('错误:' + d.message);
      } catch (_) { /* EventSource 连接错误,自动重连 */ }
    });
  }

  // ---------- 消息区点击代理(复制;全屏查看器内的克隆按钮同样可复制) ----------
  async function onCopyClick(e) {
    const copyBtn = e.target.closest('.act-copy');
    if (!copyBtn) return;
    let text = '';
    try { text = decodeURIComponent(escape(atob(copyBtn.dataset.b64 || ''))); } catch (_) {}
    const ok = await copyText(text);
    toast(ok ? '已复制' : '复制失败');
    if (ok) {
      copyBtn.classList.add('copied');
      setTimeout(() => copyBtn.classList.remove('copied'), 1200);
    }
  }
  $('chat-view').addEventListener('click', onCopyClick);
  $('fs-viewer').addEventListener('click', onCopyClick);

  // ---------- 删除本条消息(复制按钮旁) ----------
  // 后端连带删 assistant 轮的 tool 回执;成功后重拉详情重建消息区(工具卡需随该轮一起拆)。
  // 执行中也可删:库行没了,下一轮组装模型历史时自然不含这条。
  $('chat-view').addEventListener('click', async e => {
    const btn = e.target.closest('.act-del');
    if (!btn) return;
    const msgId = Number(btn.dataset.msgId);
    if (!msgId || !state.sessionId) return;
    if (!window.confirm('删除本条消息？它将不再发给 AI。')) return;
    btn.disabled = true;
    try {
      await req('DELETE', '/api/sessions/' + state.sessionId + '/messages/' + msgId);
      toast('已删除');
      const detail = await req('GET', '/api/sessions/' + state.sessionId);
      if (state.view === 'chat') renderDetail(detail);
    } catch (err) {
      toast('删除失败:' + err.message);
      btn.disabled = false;
    }
  });

  // ---------- 全屏查看器(双击气泡/工具卡放大;图片单击放大;均同步 index) ----------
  function openFullscreen(el) {
    const body = $('fs-body');
    body.innerHTML = '';
    body.style.zoom = '';
    // 深拷贝并去掉 id:保留原类名使气泡/工具卡样式在查看器内照常生效,且避免 id 重复
    const clone = el.cloneNode(true);
    clone.removeAttribute('id');
    clone.querySelectorAll('[id]').forEach(function (n) { n.removeAttribute('id'); });
    // 全屏查看直接展开参数/结果,方便观看
    clone.querySelectorAll('details').forEach(function (d) { d.open = true; });
    body.appendChild(clone);
    $('fs-viewer').classList.remove('hidden');
  }
  function closeFullscreen() { $('fs-viewer').classList.add('hidden'); $('fs-viewer').dispatchEvent(new Event('fs:close')); }
  // 双击消息气泡/工具卡 → 全屏查看(操作钮/图片不误触全屏)
  $('chat-view').addEventListener('dblclick', function (e) {
    if (e.target.closest('.act') || e.target.closest('img')) return;
    const el = e.target.closest('.bubble-ai, .bubble-user, .tool-card');
    if (el) openFullscreen(el);
  });

  // 点击消息/工具卡里的图片 → 图片全屏查看器(#fs-viewer 里的克隆图也生效)
  function imgViewerDelegate(e) {
    const im = e.target.closest('.bubble-ai img, .bubble-user img, .tool-card img');
    if (im && im.src) openImageViewer(im.src, im.alt || '');
  }
  $('chat-view').addEventListener('click', imgViewerDelegate);
  $('fs-viewer').addEventListener('click', imgViewerDelegate);

  // 图片全屏查看器:transform 缩放+平移。双指捻合缩放(1~6x)、放大后单指/鼠标拖动、双击切 2.5x。
  let openImageViewer, closeImageViewer;
  (function () {
    const viewer = document.getElementById('img-viewer');
    const img = document.getElementById('img-viewer-img');
    let scale = 1, tx = 0, ty = 0, mode = null;
    let sx = 0, sy = 0, stx = 0, sty = 0, pDist = 0, pScale = 1;
    const tdist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    function apply() {
      img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
      img.style.cursor = scale > 1 ? 'grab' : 'zoom-in';
    }
    openImageViewer = function (src, alt) {
      scale = 1; tx = ty = 0; mode = null;
      apply();
      img.src = src; img.alt = alt || '';
      viewer.classList.remove('hidden');
    };
    closeImageViewer = function () { viewer.classList.add('hidden'); };
    // 点背景(非图片)关闭
    viewer.addEventListener('click', function (e) { if (e.target === viewer) closeImageViewer(); });
    img.addEventListener('dblclick', function () {
      scale = scale > 1 ? 1 : 2.5;
      if (scale === 1) { tx = ty = 0; }
      apply();
    });
    img.addEventListener('touchstart', function (e) {
      if (e.touches.length === 2) { mode = 'pinch'; pDist = tdist(e.touches) || 1; pScale = scale; }
      else if (e.touches.length === 1 && scale > 1) { mode = 'pan'; sx = e.touches[0].clientX; sy = e.touches[0].clientY; stx = tx; sty = ty; }
      else mode = null;
    }, { passive: true });
    img.addEventListener('touchmove', function (e) {
      if (mode === 'pinch' && e.touches.length >= 2) {
        e.preventDefault();
        scale = Math.min(6, Math.max(1, pScale * tdist(e.touches) / pDist));
        if (scale === 1) { tx = ty = 0; }
        apply();
      } else if (mode === 'pan' && e.touches.length === 1) {
        e.preventDefault();
        tx = stx + e.touches[0].clientX - sx;
        ty = sty + e.touches[0].clientY - sy;
        apply();
      }
    }, { passive: false });
    img.addEventListener('touchend', function (e) { if (e.touches.length < 2) { if (mode === 'pinch') mode = null; } if (!e.touches.length) mode = null; }, { passive: true });
    img.addEventListener('touchcancel', function () { mode = null; }, { passive: true });
    // 桌面:放大后按住拖动平移
    img.addEventListener('mousedown', function (e) {
      if (scale <= 1) return;
      e.preventDefault();
      const x0 = e.clientX, y0 = e.clientY, tx0 = tx, ty0 = ty;
      const mv = function (ev) { tx = tx0 + ev.clientX - x0; ty = ty0 + ev.clientY - y0; apply(); };
      const up = function () { window.removeEventListener('mousemove', mv); window.removeEventListener('mouseup', up); };
      window.addEventListener('mousemove', mv); window.addEventListener('mouseup', up);
    });
  })();

  // 消息全屏查看器双指缩放:viewport 是 user-scalable=no(原生捏合被禁),
  // 在查看器内接管双指手势,用 CSS zoom 缩放内容(1~4 倍,关闭时重置)。
  (function () {
    const viewer = document.getElementById('fs-viewer');
    if (!viewer) return;
    let startDist = 0, startZoom = 1, pinching = false;
    const tdist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
    viewer.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 2) { pinching = false; return; }
      pinching = true;
      startDist = tdist(e.touches) || 1;
      startZoom = Number($('fs-body').style.zoom) || 1;
    }, { passive: true });
    viewer.addEventListener('touchmove', function (e) {
      if (!pinching || e.touches.length < 2) return;
      e.preventDefault(); // 双指期间阻止滚动,手势归缩放
      $('fs-body').style.zoom = Math.min(4, Math.max(1, startZoom * tdist(e.touches) / startDist)) || '';
    }, { passive: false });
    viewer.addEventListener('touchend', function (e) { if (e.touches.length < 2) pinching = false; }, { passive: true });
    viewer.addEventListener('touchcancel', function () { pinching = false; }, { passive: true });
  })();

  const fileSelected = new Set();

  function updateFilesFooter() {
    const n = fileSelected.size;
    const total = filesAllPaths.length;
    const countEl = $('files-count');
    const dlBtn = $('files-bulk-download');
    const delBtn = $('files-bulk-delete');
    const togBtn = $('files-toggle-all');

    if (togBtn) {

      const disabled = total === 0;

      togBtn.tabIndex = disabled ? -1 : 0;
      let state = 'none';

      togBtn.dataset.state = state;
      togBtn.setAttribute('aria-checked', n === total && total > 0 ? 'true' : (n > 0 ? 'mixed' : 'false'));

  async function loadFiles() {

  // 把渲染好的 Markdown HTML 里的相对图片路径，重写成可访问的任务文件下载地址：
  // 预览在浏览器里以应用页面为基准解析相对 src，而图片其实在任务目录里，直接写相对路径会 404。
  // 相对路径一律按 md 文件所在目录为基准解析到任务目录下的路径，再拼下载接口。
  function rewriteMdImageSrcs(html, mdPath) {
    const host = document.createElement('div');
    host.innerHTML = html;
    // md 所在目录（任务根下无子目录时为 ''，否则如 'docs'）
    const baseSegs = mdPath.includes('/') ? mdPath.split('/').slice(0, -1) : [];
    const resolve = function (p) {
      if (/^(https?:)?\/\//i.test(p) || p.startsWith('data:') || p.startsWith('blob:')) return null; // 已是外链/内联
      const segs = p.startsWith('/') ? [] : baseSegs.slice(); // 以 / 开头视为任务根下
      for (const part of p.split('/')) {
        if (!part || part === '.') continue;
        if (part === '..') { if (segs.length) segs.pop(); continue; }
        segs.push(part);
      }
      return segs.join('/');
    };
    host.querySelectorAll('img').forEach(function (im) {
      const src = im.getAttribute('src');
      if (!src) return;
      const rel = resolve(src);
      if (rel === null || rel === '') return;
      im.setAttribute('src', '/api/sessions/' + state.sessionId + '/files/download?path=' + encodeURIComponent(rel));
    });
    return host.innerHTML;
  }
  // 单击可预览文件 → 全屏预览(#fs-viewer)：md 按 markdown 渲染、txt 原文排版、html 用沙箱 iframe、图片用 <img>
  async function previewInFs(name) {
    try {
      const r = await fetch('/api/sessions/' + state.sessionId + '/files/download?path=' + encodeURIComponent(name));
      if (r.status === 401) { location.href = '/login'; return; }
      if (!r.ok) { let msg = 'HTTP ' + r.status; try { msg = (await r.json()).error || msg; } catch (_) {} throw new Error(msg); }
      if (/\.html?$/i.test(name)) {
        const html = await r.text();
        const body = $('fs-body');
        body.innerHTML = '';
        const iframe = document.createElement('iframe');
        iframe.className = 'fs-html-frame';
        iframe.setAttribute('sandbox', 'allow-same-origin allow-scripts');
        iframe.srcdoc = html;
        body.appendChild(iframe);
        $('fs-viewer').classList.remove('hidden');
      } else if (/\.(png|jpe?g|gif|webp|svg)$/i.test(name)) {
        // 图片：复用会话里单击图片的全屏查看器（双指缩放+拖动+双击放大），大图也能看完
        const blob = await r.blob();
        const url = URL.createObjectURL(blob);
        // 上一次的 blob URL 顺手释放；避免反复预览图片泄漏
        if (state.lastImgBlobUrl) { try { URL.revokeObjectURL(state.lastImgBlobUrl); } catch (_) {} }
        state.lastImgBlobUrl = url;
        openImageViewer(url, name);
      } else {
        // md/txt：复用双击气泡的全屏查看器
        const text = await r.text();
        let cls = 'bubble-ai', html;
        if (/\.(md|markdown)$/i.test(name)) {
          const r2 = mdHtml(text);
          html = r2.html;
          if (r2.fmt) {
            cls += ' md';
            html = rewriteMdImageSrcs(html, name);
          }
        } else {
          html = esc(text);
        }
        const wrap = document.createElement('div');
        wrap.className = 'msg other';
        wrap.innerHTML = '<div class="' + cls + '">' + html + '</div>';
        openFullscreen(wrap.firstChild);
      }
    } catch (e) { toast('预览失败:' + e.message); }
  }
  async function downloadFile(name) {
    if (!state.sessionId) return;
    try {
      const r = await req('GET', '/api/sessions/' + state.sessionId + '/files/download-token?path=' + encodeURIComponent(name));
      window.location.href = r.url; // 原生导航下载:同源自动带登录 cookie,文件名不乱
    } catch (e) { toast('下载失败:' + e.message); }
  }
  async function deleteFile(name) {
    if (!await confirmModal('删除文件', '删除文件 ' + name + ' ?', '删除', true)) return;
    try {
      await req('DELETE', '/api/sessions/' + state.sessionId + '/files?path=' + encodeURIComponent(name));
      loadFiles();
    } catch (e) { toast('删除失败:' + e.message); }
  }
  // 列表事件委托：
    //  1) 点击勾选框：仅选中状态，不触发预览/下载；
    //  2) 一旦处于多选模式（Set 非空），整行点击仅切换选中状态，不再预览/下载；
    //  3) 未进入多选模式时，点击文件名/图标根据 row.dataset.preview 决定预览或下载。
    $('files-list').addEventListener('click', e => {
      const row = e.target.closest('.file-row');
      if (!row || !state.sessionId) return;
      const path = row.dataset.path;
      if (!path) return;
      const isCheck = !!e.target.closest('.file-check');
      // 多选模式下：任何点击（仅选框/文件名/其他）都只切换选中
      if (isCheck || fileSelected.size > 0) {
        if (fileSelected.has(path)) { fileSelected.delete(path); row.classList.remove('selected'); }
        else { fileSelected.add(path); row.classList.add('selected'); }
        const ck = row.querySelector('.file-check');
        if (ck) ck.setAttribute('aria-checked', fileSelected.has(path) ? 'true' : 'false');
        updateFilesFooter();
        return;
      }
      // 默认模式：依据是否可预览选择预览/下载
      if (row.dataset.preview === '1') previewInFs(path);
      else downloadFile(path);
    });

    // 批量下载：先把所有 download-token 拿完，再用服务器直链逐个触发下载。
    // 两个历史坑：
    //  1) 边拿 token 边 location.href：首个下载导航会打断后续 fetch（第 2 个报失败）；
    //     → 先批量拿完 token 再触发。
    //  2) fetch+blob 方案：手机浏览器不认 blob 文件名（变编号/.bin），
    //     套壳 WebView 不处理 blob: 下载请求（点了没反应）；
    //     → 回到服务器原始直链（文件名跟 Content-Disposition），与单文件下载同一条链路。
    async function bulkDownload() {
      if (!state.sessionId || fileSelected.size === 0) return;
      const names = Array.from(fileSelected);
      // 第一阶段：全部 token 先拿到手（此时还没发生任何导航，fetch 不会被打断）
      const items = [];
      for (const name of names) {
        try {
          const r = await req('GET', '/api/sessions/' + state.sessionId + '/files/download-token?path=' + encodeURIComponent(name));
          if (!r || !r.url) throw new Error('未拿到下载链接');
          items.push({ url: r.url, name: String(name).split('/').pop() || name });
        } catch (e) { toast('下载失败:' + name + ' ' + e.message); }
      }
      // 第二阶段：隐藏 <a> + 服务器直链逐个触发；download 属性作手机端文件名兜底，
      // 小间隔避免移动端拦截连续多次下载
      for (const it of items) {
        const a = document.createElement('a');
        a.href = it.url;
        a.download = it.name;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { try { a.remove(); } catch (_) {} }, 1000);
        await new Promise(res => setTimeout(res, 350));
      }
    }
    async function bulkDelete() {
      if (!state.sessionId || fileSelected.size === 0) return;
      const names = Array.from(fileSelected);
      if (!await confirmModal('批量删除', '确认删除选中的 ' + names.length + ' 个文件？', '删除', true)) return;
      let ok = 0, fail = 0;
      for (const name of names) {
        try {
          await req('DELETE', '/api/sessions/' + state.sessionId + '/files?path=' + encodeURIComponent(name));
          ok++;
        } catch (e) { fail++; toast('删除失败:' + name + ' ' + e.message); }
      }
      if (ok) toast('已删除 ' + ok + ' 个文件');
      loadFiles(); // 重新拉取并重置选中
    }
    $('files-bulk-download').addEventListener('click', bulkDownload);
    $('files-bulk-delete').addEventListener('click', bulkDelete);
    const togEl = $('files-toggle-all');
    togEl.addEventListener('click', toggleSelectAll);
    togEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSelectAll(); }
    });
  // ---------- 大图上传前压缩(同步 v1:阈值/参数由 /api/system/status 透出) ----------
  const DEFAULT_UPLOAD_CFG = { image_compress_threshold_kb: 1536, image_max_dim: 2000, image_quality: 0.85 };
  let uploadCfgCache = null;
  async function getUploadCfg() {
    if (!uploadCfgCache) {
      uploadCfgCache = Object.assign({}, DEFAULT_UPLOAD_CFG);
      try {
        const s = await req('GET', '/api/system/status');
        uploadCfgCache = Object.assign(uploadCfgCache, (s && s.upload) || {});
      } catch (_) { /* 取不到配置就用默认阈值 */ }
    }
    return uploadCfgCache;
  }
  function loadImageEl(file) {
    return new Promise(function (resolve, reject) {
      const fr = new FileReader();
      fr.onload = function () {
        const im = new Image();
        im.onload = function () { resolve(im); };
        im.onerror = function () { reject(new Error('图片解码失败')); };
        im.src = fr.result;
      };
      fr.onerror = function () { reject(new Error('读取文件失败')); };
      fr.readAsDataURL(file);
    });
  }
  // 返回待上传的 File:需要时询问并压缩;取消/失败/无收益都按原文件上传
  async function maybeCompressImage(file) {
    const cfg = await getUploadCfg();
    const isImg = /^image\//.test(file.type || '') || /\.(png|jpe?g|gif|bmp|webp)$/i.test(file.name || '');
    const threshold = Number(cfg.image_compress_threshold_kb || 1536) * 1024;
    if (!isImg || file.size <= threshold) return file;
    const maxDim = Number(cfg.image_max_dim || 2000);
    const quality = Number(cfg.image_quality || 0.85);
    const ok = await confirmModal('图片文件过大',
      '「' + file.name + '」有 ' + fmtSize(file.size) + '，超过 ' + fmtSize(threshold) +
      '。建议在浏览器本地压缩为 JPEG(长边≤' + maxDim + 'px)后再上传。是否压缩？', '压缩后上传');
    if (!ok) return file;
    try {
      const img = await loadImageEl(file);
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      if (!iw || !ih) throw new Error('无法读取图片尺寸');
      const scale = Math.min(1, maxDim / Math.max(iw, ih));
      const w = Math.max(1, Math.round(iw * scale)), h = Math.max(1, Math.round(ih * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      // 透明底(PNG)转 JPEG 前先铺白,避免变黑
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const blob = await new Promise(function (res) { canvas.toBlob(function (b) { res(b); }, 'image/jpeg', quality); });
      if (!blob || blob.size >= file.size) {
        toast('压缩无收益,已按原文件上传');
        return file;
      }
      const newName = String(file.name || 'image').replace(/\.[^.]+$/, '') + '.jpg';
      toast('已压缩 ' + fmtSize(file.size) + ' → ' + fmtSize(blob.size));
      return new File([blob], newName, { type: 'image/jpeg' });
    } catch (e) {
      toast('压缩失败(' + (e && e.message || e) + '),按原文件上传');
      return file;
    }
  }

  // 面板内上传:直接写入当前会话任务目录(>阈值的图片逐个询问压缩;多文件并行上传+总进度条)
  $('file-input').addEventListener('change', async e => {
    const input = e.target;
    const files = Array.prototype.slice.call(input.files || []); // 先快照再清空,FileList 是实时的
    input.value = '';
    if (!files.length) return;
    if (!state.sessionId) { toast('先发送一条消息创建会话'); return; }
    // 大图逐个串行询问压缩(模态弹窗不能并行)
    const ready = [];
    for (const f of files) ready.push(await maybeCompressImage(f));
    // ---- 并行上传 + 实时进度 ----
    const progWrap = $('fp-progress'), progBar = $('fp-progress-bar'), progPct = $('fp-progress-pct');
    const tot = ready.reduce((s, f) => s + f.size, 0);
    const loaded = { v: 0 }; // 所有文件已上传字节总和
    let done = 0, errCount = 0;
    function paintProg() {
      const pct = tot ? Math.min(100, Math.round(loaded.v / tot * 100)) : 0;
      progBar.style.width = pct + '%';
      progPct.textContent = pct + '%';
    }
    progWrap.classList.remove('hidden');
    paintProg();
    const tasks = ready.map(f => new Promise(resolve => {
      const fd = new FormData(); fd.append('files', f, f.name);
      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/sessions/' + state.sessionId + '/files');
      let lastLoaded = 0;
      xhr.upload.onprogress = function (ev) {
        if (!ev.lengthComputable) return;
        // ev.loaded 是本文件累计已发字节,汇总时取本次增量避免多计
        loaded.v += ev.loaded - lastLoaded;
        lastLoaded = ev.loaded;
        paintProg();
      };
      xhr.onload = function () {
        if (xhr.status === 200) done++; else errCount++;
        // 终态补齐(可能没收到最后一帧 100%)
        if (lastLoaded < f.size) { loaded.v += f.size - lastLoaded; paintProg(); }
        resolve();
      };
      xhr.onerror = function () { errCount++; resolve(); };
      xhr.send(fd);
    }));
    await Promise.all(tasks);
    paintProg();
    if (errCount) toast('已上传 ' + done + ' 个，失败 ' + errCount + ' 个');
    else toast('已上传 ' + done + ' 个文件');
    loadFiles();
    // 1.2s 后收起进度条
    setTimeout(() => { progWrap.classList.add('hidden'); progBar.style.width = '0%'; }, 1200);
  });


  function renderAttachChips() {
    const row = $('attach-chips');
    row.classList.toggle('hidden', !state.attachments.length);
    row.innerHTML = state.attachments.map((f, i) =>
      '<span class="attach-chip"><span class="name">' + esc(f.name) + '</span>' +
      '<button class="rm" data-i="' + i + '" aria-label="移除附件">' +
      '<svg class="ic sm" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>' +
      '</button></span>').join('');
  }

  // ---------- 移动端右滑会话行露出删除按钮(iOS 风格) ----------
  (function bindSwipeToDelete() {
    const list = $('drawer-list');
    const THRESHOLD = 60;  // 滑过这个距离开
    let g = null;          // {x0, y0, t0, wrap, item, horiz, lastX, wasSwiped}
    function onDown(e) {
      if (e.touches.length !== 1) { g = null; return; }
      const t = e.touches[0];
      const item = e.target.closest('.conv-item');
      const wrap = e.target.closest('.conv-wrap');
      if (!item || !wrap) { g = null; return; }
      // 关闭 transform 动画,保证跟手不粘滞
      item.style.transition = 'none';
      g = { x0: t.clientX, y0: t.clientY, t0: Date.now(), wrap, item, horiz: false, lastX: t.clientX };
    }
    function onMove(e) {
      if (!g) return;
      const t = e.touches[0];
      const dx = t.clientX - g.x0;
      const dy = t.clientY - g.y0;
      // 先判断为横向手势才接管
      if (!g.horiz) {

      const off = Math.max(-60, Math.min(0, dx));
      g.item.style.transform = 'translateX(' + off + 'px)';
      g.lastX = t.clientX;
    }
    function onUp(e) {
      if (!g) return;
      const t = (e.changedTouches && e.changedTouches[0]) || null;
      const dx = t ? t.clientX - g.x0 : (g.lastX - g.x0);
      const moved = Math.abs(dx);

      g.item.style.transition = '';
      if (g.horiz) {
        if (moved >= THRESHOLD && dx < 0) {

          g.wrap.classList.remove('swiped');
          g.item.style.transform = '';

  (function bindEdgeSwipe() {
    const drawer = $('drawer'), scrim = $('scrim');
    const EDGE = 160;            // 触发识别的左缘宽度(px)
    const MAX_OPACITY = 0.4;     // 与 #scrim.show 背景一致
    let g = null;                // 当前手势 {x0,y0,t0,horiz,cancelled,off}
    function uiBlocked() {
      if (!$('settings-page').classList.contains('hidden')) return true;
      if (!$('img-viewer').classList.contains('hidden')) return true;
      if (!$('fs-viewer').classList.contains('hidden')) return true;

      return !!document.querySelector('.modal-overlay:not(.hidden)');
    }

      drawer.style.transform = ''; drawer.style.transition = '';

      if (drawer.classList.contains('open') || uiBlocked() || e.touches.length !== 1) { g = null; return; }
      const t = e.touches[0];
      if (t.clientX > EDGE) { g = null; return; } // 仅左缘起手
      g = { x0: t.clientX, y0: t.clientY, t0: Date.now(), horiz: false, cancelled: false, off: 0 };
    }, { passive: true });

      if (!g || g.cancelled) return;
      const t = e.touches[0];
      const dx = t.clientX - g.x0, dy = t.clientY - g.y0;
      if (!g.horiz) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;      // 方向未定,等待

        g.horiz = true;

      if (!drawer.style.transition) drawer.style.transition = 'none'; // 跟手时不走 CSS 动画
      drawer.classList.remove('open');
      scrim.classList.add('show');

      }

    document.addEventListener('touchcancel', e => endDrag(e, false), { passive: true });
  })();

  function confirmModal(title, text, okText, danger, opts) {

  (function bindSettingsBackSwipe() {

  const AVATAR_COLORS = ['#4285F4', '#EA4335', '#FBBC05', '#34A853', '#5C6BC0', '#00897B', '#8E24AA', '#F4511E'];
  function userInitials(name) {
    const s = String(name || '').trim();
    if (!s) return '?';
    const two = s.slice(0, 2);
    return two.charAt(0).toUpperCase() + (two.length > 1 ? two.charAt(1).toLowerCase() : '');
  }
  function avatarColor(name) {
    let h = 0;
    for (const ch of String(name || '')) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return AVATAR_COLORS[h % AVATAR_COLORS.length];
  }
  // 侧边栏底部用户区:拉取真实登录用户名,头像样式与设置页 user-card 一致(按用户名取色+首两字)

    const av = $('drawer-avatar'), un = $('drawer-user-name');

    try {
      const r = await req('GET', '/api/me');

      if (!name) return; // 未登录态(理论上不会出现,401 已自动跳登录页)
      av.textContent = userInitials(name);
      av.style.background = avatarColor(name);
      un.textContent = name;
    } catch (_) { /* 未启用认证时无 /api/me,保留默认占位 */ }
  }

  // 表单保存:收集与打开时不同的项,逐项 PATCH(搬自 settings.js saveForm)
  async function saveForm() {
    const inputs = document.querySelectorAll('#set-body .cfg-input');
    const edits = [];
    for (const inp of inputs) {
      const v = inp.value.trim();
      if (v === inp.dataset.orig) continue;
      let val = v;
      if (inp.dataset.type === 'int' || inp.dataset.type === 'float') {
        val = Number(v);
        if (v === '' || !isFinite(val)) { toast('「' + inp.dataset.label + '」需填数字'); return; }
        if (inp.dataset.type === 'int' && !Number.isInteger(val)) { toast('「' + inp.dataset.label + '」需为整数'); return; }
      }
      edits.push({ path: inp.dataset.path, value: val });
    }
    if (!edits.length) { toast('没有改动'); return; }
    const btn = $('cfg-save-btn');
    if (btn) btn.disabled = true;
    let lastChanged = [];
    try {
      for (const e of edits) {
        const r = await req('PATCH', '/api/config', { path: e.path, value: e.value });
        lastChanged = r.changed || [];
        lastChanged.forEach(k => SET.pendingKeys.add(k));
      }
      toast('已保存 ' + edits.length + ' 项' + (lastChanged.length ? ',重启后生效' : ''));
    } catch (e) {
      toast('保存失败:' + e.message);
    } finally {
      if (btn) btn.disabled = false;
    }
    renderSetPage();
  }
  // 重启服务(搬自 settings.js restart)
  async function restart() {
    if (!await confirmModal('重启服务', '重启服务使新配置生效?正在执行的 AI 会话会被打断。', '重启')) return;
    try {
      await req('POST', '/api/system/restart');
    } catch (e) {
      // 仅「有会话在跑」值得二次确认强打;配置不合法等 409 强打也无法启动,直接报给用户
      if (e.status === 409 && /个任务.*执行中/.test(e.message)) {
        if (!await confirmModal('有任务在跑', e.message, '强制重启', true)) return;
        try { await req('POST', '/api/system/restart?force=true'); }
        catch (e2) { toast('重启失败:' + e2.message); return; }
      } else { toast('重启失败:' + e.message); return; }
    }
    const btn = $('restart-btn');
    if (btn) { btn.disabled = true; btn.textContent = '重启中,请勿关闭页面…'; }
    toast('服务重启中…');
    for (let i = 0; i < 90; i++) {
      await sleep(1000);
      try { const r = await fetch('/api/health'); if (r.ok) { location.reload(); return; } } catch (_) {}
    }
    toast('90 秒内未恢复,请检查容器状态(非 Docker 部署需手动启动)');
    if (btn) { btn.disabled = false; btn.textContent = '重启服务'; }
  }

  async function saveCfg() {
    const area = $('set-editor-area');

    const text = area.value;

    if (errEl) errEl.classList.add('hidden');
    try {
      await req('POST', '/api/config/validate', { text }); // 先干跑,错误信息更友好
      const r = await req('PUT', '/api/config', { text });
      SET.cfgOrig = text;
      (r.changed || []).forEach(k => SET.pendingKeys.add(k));
      toast('配置已保存');
      setPopRaw(); // 保存成功直接退出编辑页,回服务页即刷新生效值展示
    } catch (e) {
      if (errEl) { errEl.textContent = '校验失败:' + e.message; errEl.classList.remove('hidden'); }
      toast('配置不合法,未写入');
