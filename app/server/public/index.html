<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agent 任务台</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <meta name="theme-color" content="#3964FE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app" id="app">

    <!-- ================= Tab:任务(会话列表) ================= -->
    <div id="tab-tasks" class="tab-page hidden">
      <div class="header">
        <div class="header-left"><h2>Agent 任务台</h2></div>
        <div style="display:flex; gap:2px; align-items:center;">
          <button class="icon-btn" id="search-toggle-btn" onclick="ui.toggleSearch()" title="搜索任务">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
          <button class="icon-btn" id="create-session-btn" onclick="ui.openCreate()" title="新建任务">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>
      <div class="search-bar hidden" id="search-bar">
        <input type="search" id="search-input" placeholder="搜索任务标题或消息内容" enterkeyhint="search">
        <button class="search-cancel" onclick="ui.toggleSearch()">取消</button>
      </div>
      <div class="session-list" id="session-list"></div>
    </div>

    <!-- ================= Tab:技能 ================= -->
    <div id="tab-skills" class="tab-page hidden">
      <div class="header">
        <button class="icon-btn hidden" id="skills-back-btn" onclick="skillsUI.back()" title="返回">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <div class="header-left"><h2 id="skills-title">技能管理</h2></div>
        <div class="header-right">
          <label class="icon-btn hidden" id="skill-upload-btn" title="上传文件">
            <input type="file" id="skill-file-input" style="display:none;" onchange="skillsUI.onUpload(event)">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          </label>
          <button class="icon-btn" id="skill-new-btn" onclick="skillsUI.openCreate()" title="新建技能">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>
      <div class="tab-body-area" id="skills-list"></div>
      <div class="tab-body-area hidden" id="skill-detail"></div>

      <!-- 技能文件编辑器(全屏覆盖本 Tab) -->
      <div id="skill-editor" class="hidden">
        <div class="header">
          <button class="icon-btn" onclick="skillsUI.closeEditor()" title="关闭编辑器">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <span class="chat-title" id="skill-editor-name"></span>
          <div class="header-right">
            <button class="icon-btn" onclick="skillsUI.saveFile()" title="保存">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </button>
          </div>
        </div>
        <textarea id="skill-editor-area" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </div>
    </div>

    <!-- ================= Tab:模型 ================= -->
    <div id="tab-models" class="tab-page hidden">
      <div class="header">
        <div class="header-left"><h2>模型池</h2></div>
        <div class="header-right">
          <button class="icon-btn" onclick="modelsUI.openAdd()" title="添加模型">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
      </div>
      <div class="tab-body-area" id="model-cards">
        <div class="empty-tip">加载中…</div>
      </div>
    </div>

    <!-- ================= Tab:设置 ================= -->
    <div id="tab-settings" class="tab-page hidden">
      <div class="header">
        <div class="header-left"><h2>设置</h2></div>
        <div class="header-right">
          <button class="icon-btn" onclick="cfgUI.open()" title="编辑配置文件">
            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"></path></svg>
          </button>
        </div>
      </div>
      <div class="tab-body-area">
        <div id="cfg-sections"><div class="empty-tip">加载中…</div></div>
      </div>

      <!-- config.yml 原文编辑器(全屏覆盖本 Tab) -->
      <div id="cfg-editor" class="hidden">
        <div class="header">
          <button class="icon-btn" onclick="cfgUI.close()" title="关闭">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
          </button>
          <span class="chat-title">config.yml 原文</span>
          <div class="header-right">
            <button class="icon-btn" onclick="cfgUI.save()" title="校验并保存">
              <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </button>
          </div>
        </div>
        <div id="cfg-editor-err" class="cfg-err hidden"></div>
        <textarea id="cfg-editor-area" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </div>
    </div>

    <!-- ================= 底部导航 ================= -->
    <nav class="tabbar" id="tabbar">
      <a class="tab-item" href="#/tasks" data-tab="tasks">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>任务</span>
      </a>
      <a class="tab-item" href="#/skills" data-tab="skills">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        <span>技能</span>
      </a>
      <a class="tab-item" href="#/models" data-tab="models">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="14" x2="23" y2="14"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="14" x2="4" y2="14"></line></svg>
        <span>模型</span>
      </a>
      <a class="tab-item" href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
        <span>设置</span>
      </a>
    </nav>

    <!-- ================= 聊天/任务详情(全屏覆盖,盖住底部导航) ================= -->
    <div id="chat-page" class="page hidden">
      <div class="header">
        <button class="icon-btn back-btn" onclick="ui.backToList()">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="chat-title" id="chat-title" onclick="ui.renameSession()" title="点击重命名" style="cursor:pointer"></span>
        <div class="header-right">
          <button class="icon-btn" onclick="ui.toggleFiles(event)" title="文件">
            <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          </button>
        </div>
      </div>

      <!-- 任务状态栏 -->
      <div class="phase-bar" id="phase-bar">
        <span class="status-pill" id="status-pill">--</span>
        <button class="stop-link hidden" id="stop-btn" onclick="ui.stopSession()">终止</button>
        <button class="stop-link muted hidden" id="model-switch-btn" onclick="ui.openModelSwitch()">选择模型</button>
      </div>

      <div class="messages" id="messages"></div>

      <!-- 文件面板 -->
      <div class="files-panel hidden" id="files-panel">
        <div class="files-panel-header">
          <span>任务文件</span>
          <div>
            <label class="icon-btn" title="上传文件">
              <input type="file" id="file-input" multiple style="display:none;" onchange="ui.uploadFiles(event)">
              <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </label>
            <button class="icon-btn" onclick="ui.toggleFiles()">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>
        <div class="files-list" id="files-list"></div>
      </div>

      <div class="attach-row hidden" id="attach-row"></div>
      <div class="input-area">
        <label class="file-upload-btn" id="attach-btn" title="上传文件(随下一条消息发送)">
          <input type="file" id="msg-file-input" multiple style="display:none;" onchange="ui.uploadFiles(event)">
          <svg viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
          <span class="up-pct hidden" id="up-pct">0%</span>
        </label>
        <textarea id="msg-input" placeholder="输入消息..." rows="1"></textarea>
        <button class="send-btn" onclick="ui.send()">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
      </div>
    </div>

    <!-- 新建会话弹窗 -->
    <div id="create-modal" class="modal-overlay hidden" onclick="if(event.target===this)ui.closeCreate()">
      <div class="modal">
        <button class="modal-close-btn" onclick="ui.closeCreate()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3>新建任务会话</h3>
        <input type="text" id="new-title" placeholder="任务标题（留空自动取首条消息）" style="width:100%">
        <select id="new-model" style="width:100%"><option value="">自动分配</option></select>
        <button class="primary-btn" onclick="ui.createSession()" style="width:100%">创建</button>
      </div>
    </div>

    <!-- 已完成会话手动选择模型弹窗 -->
    <div id="bind-model-modal" class="modal-overlay hidden" onclick="if(event.target===this)ui.closeModelSwitch()">
      <div class="modal">
        <button class="modal-close-btn" onclick="ui.closeModelSwitch()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3>选择模型继续会话</h3>
        <p class="empty-tip">为已结束(已完成/已终止)的会话指定一个空闲模型,绑定后继续对话将优先使用该模型。</p>
        <div class="btn-row" id="bind-model-list" style="flex-direction:column;align-items:stretch;gap:8px;"></div>
      </div>
    </div>

    <!-- 新建技能弹窗 -->
    <div id="skill-create-modal" class="modal-overlay hidden" onclick="if(event.target===this)skillsUI.closeCreate()">
      <div class="modal">
        <button class="modal-close-btn" onclick="skillsUI.closeCreate()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3>新建技能</h3>
        <input type="text" id="skill-new-name" placeholder="技能名(字母/数字/-/_)" style="width:100%">
        <input type="text" id="skill-new-desc" placeholder="一句话描述(何时使用该技能)" style="width:100%">
        <button class="primary-btn" style="width:100%" onclick="skillsUI.createSkill()">创建</button>
      </div>
    </div>

    <!-- 模型编辑/新增弹窗 -->
    <div id="model-edit-modal" class="modal-overlay hidden" onclick="if(event.target===this)modelsUI.close()">
      <div class="modal">
        <button class="modal-close-btn" onclick="modelsUI.close()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3 id="moe-title">编辑模型</h3>
        <input type="text" id="moe-name" placeholder="显示名(留空同 id)" style="width:100%">
        <input type="text" id="moe-id" placeholder="id(唯一标识)" style="width:100%">
        <input type="text" id="moe-url" placeholder="上游地址(OpenAI 兼容 /v1)" style="width:100%">
        <input type="text" id="moe-key" placeholder="api_key(留空则不带鉴权头)" style="width:100%">
        <label class="del-dir"><input type="checkbox" id="moe-vision">支持图片输入(vision)</label>
        <div class="btn-row">
          <button class="ghost-btn danger hidden" id="moe-del-btn" onclick="modelsUI.del()">删除</button>
          <button class="primary-btn" onclick="modelsUI.save()">保存</button>
        </div>
        <div class="cfg-note">写入 config.yml,到「设置」页重启服务后生效。id 不可在此修改(历史会话按 id 绑定),如需改动请编辑配置文件原文。</div>
      </div>
    </div>

    <!-- 全局确认弹窗(替代原生 confirm) -->
    <div id="confirm-modal" class="modal-overlay hidden" onclick="if(event.target===this)confirmClose(false)">
      <div class="modal">
        <h3 id="confirm-title">请确认</h3>
        <div class="modal-text" id="confirm-text"></div>
        <div class="btn-row">
          <button class="ghost-btn" onclick="confirmClose(false)">取消</button>
          <button class="primary-btn" id="confirm-ok-btn" onclick="confirmClose(true)">确定</button>
        </div>
      </div>
    </div>

    <!-- 全局输入弹窗(替代原生 prompt) -->
    <div id="prompt-modal" class="modal-overlay hidden" onclick="if(event.target===this)promptCancel()">
      <div class="modal">
        <button class="modal-close-btn" onclick="promptCancel()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3 id="prompt-title">请输入</h3>
        <input type="text" id="prompt-input" style="width:100%">
        <div class="btn-row">
          <button class="ghost-btn" onclick="promptCancel()">取消</button>
          <button class="primary-btn" onclick="promptOk()">确定</button>
        </div>
      </div>
    </div>

    <!-- 删除会话弹窗 -->
    <div id="delete-modal" class="modal-overlay hidden" onclick="if(event.target===this)ui.closeDelete()">
      <div class="modal">
        <h3>删除会话</h3>
        <br>
        <div class="modal-text" id="delete-modal-text">确定删除该会话？</div>
        <label class="del-dir"><input type="checkbox" id="del-dir-check" checked>同时删除任务目录（文件将不可恢复）</label>
        <br>
        <div class="btn-row">
          <button class="ghost-btn" onclick="ui.closeDelete()">取消</button>
          <button class="primary-btn" style="background:linear-gradient(135deg,#a3352a,#d2483c);" onclick="ui.confirmDelete()">删除</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <!-- 消息全屏查看器(双击气泡打开) -->
  <div id="fs-viewer" class="hidden" onclick="if(event.target===this)ui.closeFullscreen()">
    <button class="fs-close" onclick="ui.closeFullscreen()">✕</button>
    <div class="msg-bubble fs-panel" id="fs-body"></div>
  </div>

  <!-- 发版时更新 v 参数,避免移动端浏览器缓存旧 JS -->
  <script src="/js/core.js?v=20260902g"></script>
  <script src="/js/tasks.js?v=20260902g"></script>
  <script src="/js/skills.js?v=20260902g"></script>
  <script src="/js/models.js?v=20260902g"></script>
  <script src="/js/settings.js?v=20260902g"></script>
</body>
</html>
