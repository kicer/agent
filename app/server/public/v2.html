<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agent 任务台 · v2</title>
  <meta name="theme-color" content="#3964FE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="/css/v2.css">
</head>
<body>
  <div id="app">

    <!-- ================= 顶部导航栏 ================= -->
    <header class="header">
      <button class="icon-btn" id="menu-btn" title="历史记录" aria-label="打开历史记录">
        <svg class="ic" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
      </button>
      <div class="header-center" id="header-center"><!-- 未对话状态为空白,JS 注入对话信息 --></div>
      <button class="icon-btn hidden" id="new-chat-btn" title="新建对话" aria-label="新建对话">
        <svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </header>

    <main>
      <!-- ================= 未对话状态:模式切换区 ================= -->
      <section id="welcome-view">
        <div class="welcome-head">
          <div class="logo-badge">
            <svg class="ic" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="3"></rect><line x1="12" y1="4" x2="12" y2="8"></line><circle cx="12" cy="3" r="1.4"></circle><circle cx="9" cy="13.5" r="1" fill="currentColor" stroke="none"></circle><circle cx="15" cy="13.5" r="1" fill="currentColor" stroke="none"></circle><line x1="9.5" y1="17" x2="14.5" y2="17"></line></svg>
          </div>
          <div class="welcome-slog</title>an">选择模式开始对话</div>
        </div>

        <div class="mode-switch" role="tablist" id="mode-switch">
          <button class="mode-chip on" data-mode="secretary" role="tab" aria-selected="true">
            <svg class="ic sm" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 13L2 9z"></path><polyline points="2 9 22 9"></polyline><polyline points="10 3 8 9 12 22"></polyline><polyline points="14 3 16 9 12 22"></polyline></svg>
            文秘助理
          </button>
          <button class="mode-chip" data-mode="vision" role="tab" aria-selected="false">
            <svg class="ic sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            识图专家
          </button>
        </div>
        <div class="mode-hint" id="mode-hint"></div>
      </section>

      <!-- ================= 对话状态:对话内容区 ================= -->
      <section id="chat-view" class="hidden"></section>
    </main>

    <!-- ================= 底部输入区 ================= -->
    <footer>
      <div class="attach-chips hidden" id="attach-chips"></div>
      <div class="input-shell">
        <textarea id="msg-input" placeholder="传送信息" rows="2" enterkeyhint="send"></textarea>
        <div class="input-actions">
        <button class="think-toggle" id="deep-think-btn" title="深度思考">
          <svg viewBox="0 0 24 24" class="ic sm"><path d="M12 10.2a1.8 1.8 0 1 0 0.001 3.6A1.8 1.8 0 0 0 12 10.2z"></path><path stroke-width="1.5" d="M15.76 15.76 C10.955 20.565 5.373 22.779 3.297 20.703 C1.22 18.627 3.434 13.045 8.24 8.24 C13.045 3.435 18.627 1.22 20.703 3.297 C22.779 5.374 20.565 10.955 15.76 15.76z"></path><path stroke-width="1.5" d="M16.096 7.904 C20.905 12.713 22.965 18.298 20.703 20.703 C18.44 23.108 13.003 20.755 8.24 15.76 C3.477 10.76 1.22 5.373 3.297 3.297 C5.374 1.22 10.955 3.434 16.096 7.904z"></path></svg>
          深度思考
        </button>
        <button class="plus-btn" id="attach-btn" title="添加附件或图片" aria-label="添加附件">
          <svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <input type="file" id="file-input" multiple hidden>
        </div>
      </div>

    </footer>

    <!-- ================= 历史记录抽屉 ================= -->
    <div id="scrim"></div>
    <aside id="drawer" aria-label="对话历史">
      <div class="drawer-search">
        <div class="search-box">
          <svg class="ic sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="search" id="search-input" placeholder="搜寻对话内容..." enterkeyhint="search">
        </div>
      </div>
      <div class="drawer-list" id="drawer-list"></div>
      <div class="drawer-user" id="drawer-user">
        <div class="avatar">A</div>
        <div class="user-name">Agent 用户</div>
        <button class="user-more" id="user-more-btn" title="更多设置" aria-label="更多设置">
          <svg class="ic sm" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"></circle><circle cx="19" cy="12" r="1.4" fill="currentColor" stroke="none"></circle></svg>
        </button>
      </div>
    </aside>

    <!-- ================= 设置区(覆盖层;入口:侧边栏用户区) ================= -->
    <section id="settings-page" class="hidden" aria-label="设置">
      <!-- 顶栏:左侧返回 + 中间标题 + 右侧操作按钮,风格与对话页 header 一致 -->
      <header class="header">
        <button class="icon-btn" id="set-back-btn" title="返回" aria-label="返回">
          <svg class="ic" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <div class="header-center"><div class="header-title" id="set-title">设置</div></div>
        <div class="header-right" id="set-actions"><!-- JS 按页注入操作按钮 --></div>
      </header>
      <div id="set-body"><!-- JS 按页渲染 --></div>
    </section>

    <!-- 新建技能弹窗(搬自 index) -->
    <div id="skill-create-modal" class="modal-overlay hidden" onclick="if(event.target===this)sUI.closeCreate()">
      <div class="modal">
        <button class="modal-close-btn" onclick="sUI.closeCreate()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3>新建技能</h3>
        <input type="text" id="skill-new-name" placeholder="技能名(字母/数字/-/_)">
        <input type="text" id="skill-new-desc" placeholder="一句话描述(何时使用该技能)">
        <button class="primary-btn" onclick="sUI.createSkill()">创建</button>
      </div>
    </div>

    <!-- 模型编辑/新增弹窗(搬自 index) -->
    <div id="model-edit-modal" class="modal-overlay hidden" onclick="if(event.target===this)sUI.mClose()">
      <div class="modal">
        <button class="modal-close-btn" onclick="sUI.mClose()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3 id="moe-title">编辑模型</h3>
        <select id="moe-target"></select>
        <div id="moe-newkey-wrap" class="hidden">
          <select id="moe-nk-plat"></select>
          <input type="text" id="moe-nk-key" placeholder="api_key(留空则不带鉴权头)">
          <input type="number" id="moe-nk-con" min="1" step="1" value="1" placeholder="并发数 concurrency(默认 1)">
        </div>
        <div id="moe-newplat-wrap" class="hidden">
          <input type="text" id="moe-np-name" placeholder="平台名称(留空取域名主机段)">
          <input type="text" id="moe-np-url" placeholder="平台上游地址(OpenAI 兼容 /v1)">
          <input type="text" id="moe-np-type" value="openai" placeholder="类型(任意自定义;余额查询已接入:deepseek)">
          <input type="text" id="moe-np-key" placeholder="api_key(留空则不带鉴权头)">
          <input type="number" id="moe-np-con" min="1" step="1" value="1" placeholder="并发数 concurrency(默认 1)">
        </div>
        <input type="text" id="moe-name" placeholder="显示名(留空同 id)">
        <input type="text" id="moe-id" placeholder="id(上游模型名,全局唯一)">
        <label class="del-dir"><input type="checkbox" id="moe-vision">支持图片输入(vision)</label>
        <div class="btn-row">
          <button class="ghost-btn danger hidden" id="moe-del-btn" onclick="sUI.mDel()">删除</button>
          <button class="primary-btn" onclick="sUI.mSave()">保存</button>
        </div>
        <div class="cfg-note">写入 config.yml,到「服务」页重启服务后生效。id 不可在此修改(历史会话按 id 绑定),如需改动请编辑配置文件原文。</div>
      </div>
    </div>

    <!-- 全局确认弹窗(替代原生 confirm;搬自 index) -->
    <div id="confirm-modal" class="modal-overlay hidden" onclick="if(event.target===this)confirmClose(false)">
      <div class="modal">
        <h3 id="confirm-title">请确认</h3>
        <div class="modal-text" id="confirm-text"></div>
        <div class="btn-row">
          <button class="ghost-btn" onclick="confirmClose(false)">取消</button>
          <button class="primary-btn" id="confirm-ok-btn" onclick="confirmClose(true)">确定</button>
        </div>
      </div>
    </div>

    <!-- 全局输入弹窗(替代原生 prompt;搬自 index) -->
    <div id="prompt-modal" class="modal-overlay hidden" onclick="if(event.target===this)promptCancel()">
      <div class="modal">
        <button class="modal-close-btn" onclick="promptCancel()">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <h3 id="prompt-title">请输入</h3>
        <input type="text" id="prompt-input">
        <div class="btn-row">
          <button class="ghost-btn" onclick="promptCancel()">取消</button>
          <button class="primary-btn" onclick="promptOk()">确定</button>
        </div>
      </div>
    </div>

    <div id="toast" class="hidden"></div>
  </div>

  <script>
  /*
   * ============================================================================
   * Agent 任务台 v2 —— 接入真实后端(全部沿用 /api 现有接口,未新增任何接口)
   * ----------------------------------------------------------------------------
   * 已接入:
   *   GET    /api/sessions?status=active&limit=100             抽屉「今天/昨天」活跃列表
   *   GET    /api/sessions?status=done&limit=50&with_total=1   抽屉归档列表
   *   GET    /api/sessions?q=..&limit=50                       抽屉搜索
   *   POST   /api/sessions {title:'', model_id:''}             首条消息自动建档
   *   GET    /api/sessions/:id                                 打开会话(消息+文件)
   *   DELETE /api/sessions/:id?delete_dir=true                 删除会话(操作栏删除按钮)
   *   POST   /api/sessions/:id/messages {content, attachments} 发送消息
   *   POST   /api/sessions/:id/files                           附件上传(multipart)
   *   GET    /api/sessions/:id/stream                          SSE 流式输出
   *
   * 设置区(侧边栏用户区整行点击进入;页面搬自 index.html,未新增任何接口):
   *   GET    /api/system/status | POST /api/system/restart[?force=true]   服务·状态与重启
   *   GET/PUT/PATCH /api/config | POST /api/config/validate               系统配置 / 原文编辑 / 模型增删改
   *   GET    /api/models | GET /api/platforms/balance                     模型·模型池与余额
   *   GET/POST/PUT/DELETE /api/skills[/:name][/file|/upload|/rename]      技能·技能与文件管理
   *   GET    /api/me | POST /api/password | GET /logout                    账户·信息/改密/退出
   *
   * 后端已有但 v2 尚未接入 UI 的接口(先列出,不实现):
   *   PATCH  /api/sessions/:id                                重命名(后端已支持)
   *   POST   /api/sessions/:id/stop | /release | /bind        终止/断开/绑定模型
   *   DELETE /api/sessions/:id/messages                        清空会话内容
   *   GET    /api/sessions/:id/files/download-token?path=      文件下载
   *
   * 无后端支撑、仅前端占位的概念(先不实现):
   *   · 「文秘助理 / 识图专家」模式 —— 后端无 mode 字段,当前仅影响提示文案
   *   · 「深度思考」开关 —— 后端无 reasoning/deep-think 参数,当前仅本地视觉状态
   *   · 「思考过程」折叠块(已思考 N 秒) —— 后端不产出 reasoning,已移除 mock
   *   · 按消息粒度删除 —— 现有接口为会话级删除,故操作栏删除按钮指向删除会话
   * 鉴权:任意请求 401 时跳转 /login(与 core.js 的 req 一致)。
   * ============================================================================
   */
  'use strict';

  // ---------- 工具 ----------
  function $(id) { return document.getElementById(id); }
  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const p = n => String(n).padStart(2, '0');
    const now = new Date();
    const hm = p(d.getHours()) + ':' + p(d.getMinutes());
    if (now.toDateString() === d.toDateString()) return hm;
    const md = (d.getMonth() + 1) + '/' + d.getDate();
    return (d.getFullYear() === now.getFullYear() ? md : d.getFullYear() + '/' + md) + ' ' + hm;
  }
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.add('hidden'), 2000);
  }
  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
    } catch (_) { /* 落入降级 */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '-9999px'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (_) { return false; }
  }

  // ---------- API(与 core.js 的 req 保持一致) ----------
  async function req(method, url, body, isForm) {
    const opt = { method, headers: {} };
    if (body && !isForm) {
      opt.headers['Content-Type'] = 'application/json';
      opt.body = JSON.stringify(body);
    } else if (body && isForm) {
      opt.body = body;
    }
    const res = await fetch(url, opt);
    if (res.status === 401) { location.href = '/login'; throw new Error('未登录'); }
    if (!res.ok) {
      let msg = 'HTTP ' + res.status;
      try { msg = (await res.json()).error || msg; } catch (_) {}
      const err = new Error(msg);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  // ---------- 模式配置 ----------
  const MODES = {
    secretary: { label: '文秘助理', hint: '支持文字输入，可起草、润色、整理文书' },
    vision:    { label: '识图专家', hint: '支持图片识别输入' },
  };

  // ---------- 全局状态 ----------
  const state = {
    view: 'welcome',            // welcome | chat
    mode: 'secretary',          // 模式选择区当前选中
    deepThink: false,           // 深度思考开关(仅本地视觉状态,无后端参数)
    sessionId: null,            // 当前会话
    sessionTitle: '',           // 当前会话标题
    status: '',                 // 当前会话状态(SSE 更新)
    sessions: [],               // 抽屉列表缓存
    attachments: [],            // 待发送附件 {file, name, size}
    es: null,                   // EventSource
    streamText: '',             // 当前流式累积文本
    streamEl: null,             // 当前流式 AI 气泡
    toolLines: {},              // tool_call_id -> 工具行元素
    typingEl: null,             // 「思考中」占位
    streaming: false,
  };

  // ---------- 视图切换 ----------
  function setView(view) {
    state.view = view;
    $('welcome-view').classList.toggle('hidden', view !== 'welcome');
    $('chat-view').classList.toggle('hidden', view !== 'chat');
    $('new-chat-btn').classList.toggle('hidden', view !== 'chat'); // 新建按钮仅对话状态显示
    renderHeader();
  }

  function renderHeader() {
    const c = $('header-center');
    if (state.view !== 'chat' || !state.sessionId) { c.innerHTML = ''; return; }
    const stMap = { queued: '排队中', active: '活跃中', held: '保持中', completed: '已完成', cancelled: '已终止' };
    const st = stMap[state.status] || '';
    c.innerHTML =
      '<div class="header-title">' + esc(state.sessionTitle || state.sessionId) + '</div>' +
      '<div class="header-sub"><span class="mode">' + esc(MODES[state.mode].label) + '</span>' +
      (st ? ' · ' + esc(st) : '') + ' · 回答由 AI 产生，仅供参考</div>';
  }

  // ---------- 模式切换区 ----------
  function selectMode(mode) {
    state.mode = mode;
    for (const chip of document.querySelectorAll('.mode-chip')) {
      const on = chip.dataset.mode === mode;
      chip.classList.toggle('on', on);
      chip.setAttribute('aria-selected', on ? 'true' : 'false');
    }
    $('mode-hint').textContent = MODES[mode].hint;
  }
  $('mode-switch').addEventListener('click', e => {
    const chip = e.target.closest('.mode-chip');
    if (chip) selectMode(chip.dataset.mode);
  });

  // ---------- 消息渲染 ----------
  // 服务端把附件说明拼在正文前(【系统通知】用户上传了文件：...),此处拆开单独展示 📎 行
  function parseUploadNotice(content) {
    const m = /^【系统通知】用户上传了文件：([^\n]*)(?:\n([\s\S]*))?$/.exec(content || '');
    if (!m) return { text: content || '', files: null };
    const files = m[1].split('、').map(s => s.replace(/（大小[^）]*）$/, '').trim()).filter(Boolean);
    return { text: m[2] || '', files: files };
  }

  function actionsHtml(ts, content) {
    const b64 = btoa(unescape(encodeURIComponent(content)));
    return '<div class="msg-actions">' +
      '<span>' + fmtTime(ts) + '</span>' +
      '<button class="act act-copy" title="复制" data-b64="' + b64 + '">' +
        '<svg class="ic sm" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>' +
      '</button>' +
      '<button class="act act-del" title="删除会话">' +
        '<svg class="ic sm" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>' +
      '</button>' +
    '</div>';
  }

  function userMsgHtml(m) {
    const p = parseUploadNotice(m.content);
    const attach = p.files && p.files.length
      ? '<div class="attach-line">📎 ' + esc(p.files.join('、')) + '</div>' : '';
    return '<div class="msg me">' +
      '<div class="bubble-user">' + attach + esc(p.text) + '</div>' +
      '<div class="msg-actions"><span>' + fmtTime(m.created_at) + '</span></div>' +
    '</div>';
  }

  function aiMsgHtml(m) {
    const hasText = !!(m.content && m.content.trim());
    let toolLines = '';
    if (m.tool_calls) {
      let calls = m.tool_calls;
      try { if (typeof calls === 'string') calls = JSON.parse(calls); } catch (_) { calls = null; }
      if (Array.isArray(calls)) {
        toolLines = calls.map(c => '<div class="tool-line">🔧 ' + esc(c.function && c.function.name || '工具') + '</div>').join('');
      }
    }
    return '<div class="msg other">' +
      toolLines +
      (hasText ? '<div class="bubble-ai">' + esc(m.content) + '</div>' : '') +
      (hasText ? actionsHtml(m.created_at, m.content) : '') +
    '</div>';
  }

  function msgNode(m) {
    if (m.role === 'user') return userMsgHtml(m);
    if (m.role === 'assistant') return aiMsgHtml(m);
    return null; // tool 结果不单独展示
  }

  function renderDetail(detail) {
    const s = detail.session;
    state.sessionTitle = (s && s.title) || '';
    state.status = (s && s.status) || '';
    renderHeader();
    const box = $('chat-view');
    box.innerHTML = '';
    for (const m of detail.messages || []) {
      const node = msgNode(m);
      if (node) box.insertAdjacentHTML('beforeend', node);
    }
    if (!(detail.messages || []).length) {
      box.innerHTML = '<div class="drawer-empty">描述你的需求，AI 会和你讨论并直接干活。</div>';
    }
    scrollBottom();
  }

  function appendUserMsg(content, fileNames) {
    const attach = fileNames && fileNames.length
      ? '<div class="attach-line">📎 ' + esc(fileNames.join('、')) + '</div>' : '';
    const wrap = document.createElement('div');
    wrap.className = 'msg me';
    wrap.innerHTML = '<div class="bubble-user">' + attach + esc(content) + '</div>' +
      '<div class="msg-actions"><span>' + fmtTime(Date.now()) + '</span></div>';
    $('chat-view').appendChild(wrap);
    scrollBottom();
  }

  function scrollBottom() {
    const box = $('chat-view');
    box.scrollTop = box.scrollHeight;

  function addTyping() {
    removeTyping();

  // ---------- 会话列表(抽屉) ----------
  function groupLabel(ts) {
    const d = new Date(ts), n = new Date();
    const sod = t => new Date(t.getFullYear(), t.getMonth(), t.getDate()).getTime();
    const diff = (sod(n) - sod(d)) / 86400000;
    if (diff <= 0) return '今天';
    if (diff === 1) return '昨天';
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月';
  }

  function renderDrawerList() {
    const list = state.sessions.slice().sort((a, b) => (b.updated_at || 0) - (a.updated_at || 0));
    const box = $('drawer-list');
    if (!list.length) { box.innerHTML = '<div class="drawer-empty">没有找到相关对话</div>'; return; }
    let html = '', lastGroup = null;
    for (const s of list) {
      const g = groupLabel(s.updated_at);
      if (g !== lastGroup) { html += '<div class="group-label">' + esc(g) + '</div>'; lastGroup = g; }
      html += '<button class="conv-item' + (s.id === state.sessionId ? ' active' : '') + '" data-id="' + esc(s.id) + '">' +
        esc(s.title || s.id) + '</button>';
    }
    box.innerHTML = html;
  }

  async function loadSessionList() {
    const q = $('search-input').value.trim();
    try {
      let list;
      if (q) {
        const r = await req('GET', '/api/sessions?q=' + encodeURIComponent(q) + '&limit=50&with_total=1');
        list = r.rows || [];
      } else {
        const [active, done] = await Promise.all([
          req('GET', '/api/sessions?status=active&limit=100'),
          req('GET', '/api/sessions?status=done&limit=50&with_total=1'),
        ]);
        list = (active || []).concat((done && done.rows) || []);
      }
      state.sessions = list;
      renderDrawerList();
    } catch (e) { toast('加载会话失败:' + e.message); }
  }

  // ---------- 会话打开 / 新建 / 删除 ----------
  function closeStream() {
    if (state.es) { state.es.close(); state.es = null; }
  }

  async function openSession(id) {
    closeStream();
    removeTyping();
    state.sessionId = id;
    state.streamEl = null;
    state.streamText = '';
    state.toolLines = {};
    state.streaming = false;
    state.attachments = [];
    renderAttachChips();
    setView('chat');
    $('chat-view').innerHTML = '<div class="drawer-empty">加载中…</div>';
    try {
      const detail = await req('GET', '/api/sessions/' + id);
      if (state.sessionId !== id) return; // 期间已切到别的会话
      renderDetail(detail);
      connectStream();
    } catch (e) {
      if (state.sessionId === id) toast('打开会话失败:' + e.message);
    }
  }

  // 确保存在当前会话:首条消息自动建档(POST /api/sessions)
  async function ensureSession() {
    if (state.sessionId) return state.sessionId;
    const s = await req('POST', '/api/sessions', { title: '', model_id: '' });
    state.sessionId = s.id;
    state.sessionTitle = (s && s.title) || '';
    setView('chat');
    renderHeader();
    connectStream();
    return s.id;
  }

  function newChat() {
    closeStream();
    removeTyping();
    state.sessionId = null;
    state.sessionTitle = '';
    state.status = '';
    state.attachments = [];
    state.streamEl = null;
    state.streamText = '';
    state.toolLines = {};
    state.streaming = false;
    renderAttachChips();
    selectMode('secretary'); // 置顶逻辑:新建时自动选中【文秘助理】
    setView('welcome');
    $('chat-view').innerHTML = '';
    $('msg-input').value = '';
    autosize();
  }

  async function deleteSession() {
    if (!state.sessionId) return;
    const id = state.sessionId;
    if (!confirm('删除整个会话？其任务文件也将一并删除，且不可恢复。')) return;
    try {
      await req('DELETE', '/api/sessions/' + id + '?delete_dir=true');
      newChat();
      loadSessionList();
    } catch (e) { toast('删除失败:' + e.message); }
  }

  // ---------- 发送 ----------
  async function uploadFiles(sessionId, files) {
    const fd = new FormData();
    for (const f of files) fd.append('files', f.file, f.name);
    const r = await req('POST', '/api/sessions/' + sessionId + '/files', fd, true);
    return (r.uploaded || []).map(u => ({ name: u.filename, size: u.size }));
  }

  async function send() {
    const ta = $('msg-input');
    const content = ta.value.trim();
    if (!content && !state.attachments.length) return;

    const pending = state.attachments.slice();
    state.attachments = [];
    renderAttachChips();
    ta.value = '';
    autosize();

    try {
      const id = await ensureSession();
      let atts = [];
      if (pending.length) atts = await uploadFiles(id, pending);
      const body = { content };
      if (atts.length) body.attachments = atts;
      await req('POST', '/api/sessions/' + id + '/messages', body);

      appendUserMsg(content, atts.map(a => a.name));
      if (!state.sessionTitle && content) {
        state.sessionTitle = content.length > 24 ? content.slice(0, 24) : content;
      }
      renderHeader();
      addTyping();
      loadSessionList();
    } catch (e) {
      // 发送失败:附件还原,交由用户决定重试或移除
      state.attachments = pending.concat(state.attachments);
      renderAttachChips();
      toast('发送失败:' + e.message);
    }
  }

  // ---------- SSE 流式 ----------
  function connectStream() {
    closeStream();
    if (!state.sessionId) return;
    const es = new EventSource('/api/sessions/' + state.sessionId + '/stream');
    state.es = es;
    es.addEventListener('status', ev => {
      const d = JSON.parse(ev.data);
      state.status = d.status;
      renderHeader();
    });
    es.addEventListener('assistant_delta', ev => {
      const d = JSON.parse(ev.data);
      removeTyping();
      state.streamText += d.text;
      if (!state.streamEl) {
        if (!state.streamText.trim()) return; // 忽略前导空白(纯工具调用回合无文本)
        const wrap = document.createElement('div');
        wrap.className = 'msg other';
        const bubble = document.createElement('div');
        bubble.className = 'bubble-ai';
        wrap.appendChild(bubble);
        $('chat-view').appendChild(wrap);
        state.streamEl = bubble;
        state.streamText = d.text;
      }
      state.streamEl.textContent = state.streamText;
      state.streaming = true;
      scrollBottom();
    });
    es.addEventListener('assistant_message', ev => {
      const d = JSON.parse(ev.data);
      removeTyping();
      const hasText = !!(d.content && d.content.trim());
      if (state.streamEl) {
        if (hasText) state.streamEl.textContent = d.content;
        else state.streamEl.remove();
        state.streamEl = null;
        state.streamText = '';
      } else if (hasText) {
        const wrap = document.createElement('div');
        wrap.className = 'msg other';
        wrap.innerHTML = '<div class="bubble-ai">' + esc(d.content) + '</div>';
        $('chat-view').appendChild(wrap);
      }
      state.streaming = false;
      scrollBottom();
    });
    es.addEventListener('tool_call', ev => {
      const d = JSON.parse(ev.data);
      removeTyping();
      const wrap = document.createElement('div');
      wrap.className = 'msg other';
      wrap.innerHTML = '<div class="tool-line">🔧 ' + esc(d.name || '工具') + '</div>';
      $('chat-view').appendChild(wrap);
      state.toolLines[d.id] = wrap;
      scrollBottom();
    });
    es.addEventListener('tool_result', ev => {
      const d = JSON.parse(ev.data);
      const wrap = state.toolLines[d.tool_call_id];
      if (wrap && d.is_error) {
        const line = wrap.querySelector('.tool-line');
        if (line) line.textContent += ' ⚠️ 失败';
      }
      scrollBottom();
    });
    es.addEventListener('done', ev => {
      removeTyping();
      state.streaming = false;
      state.streamEl = null;
      state.streamText = '';
      state.toolLines = {};
      loadSessionList();
    });
    es.addEventListener('error', ev => {
      removeTyping();
      try {
        const d = JSON.parse(ev.data);
        if (d && d.message) toast('错误:' + d.message);
      } catch (_) { /* EventSource 连接错误,自动重连 */ }
    });
  }

  function fmtSize(n) {
    if (n == null) return '';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';

    const s = Math.floor((ms || 0) / 1000);
    const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
    if (d) return d + ' 天 ' + h + ' 小时';

    if (m) return m + ' 分 ' + (s % 60) + ' 秒';

  // ---------- 统一确认/输入弹窗(搬自 core.js;会话删除仍用原生 confirm) ----------
  let _dlgResolve = null;
  function _dlgSettle(val) {
    $('confirm-modal').classList.add('hidden');
    $('prompt-modal').classList.add('hidden');
    const r = _dlgResolve;
    _dlgResolve = null;
    if (r) r(val);
  }
  function confirmModal(title, text, okText, danger) {
    return new Promise(resolve => {
      _dlgResolve = resolve;
      $('confirm-title').textContent = title || '请确认';
      $('confirm-text').textContent = text || '';
      const ok = $('confirm-ok-btn');
      ok.textContent = okText || '确定';
      ok.style.background = danger ? 'linear-gradient(135deg,#a3352a,#d2483c)' : '';
      $('confirm-modal').classList.remove('hidden');
    });
  }
  function confirmClose(v) { _dlgSettle(v); }
  function promptModal(title, placeholder, initial, opts) {
    return new Promise(resolve => {
      _dlgResolve = resolve;
      $('prompt-title').textContent = title || '请输入';
      const inp = $('prompt-input');
      inp.placeholder = placeholder || '';
      inp.value = initial || '';
      inp.type = opts && opts.type ? opts.type : 'text';
      $('prompt-modal').classList.remove('hidden');
      setTimeout(() => inp.focus(), 60);
    });
  }

  // 表单保存:收集与打开时不同的项,逐项 PATCH(搬自 settings.js saveForm)
  async function saveForm() {
    const inputs = document.querySelectorAll('#set-body .cfg-input');
    const edits = [];
    for (const inp of inputs) {
      const v = inp.value.trim();
      if (v === inp.dataset.orig) continue;
      let val = v;
      if (inp.dataset.type === 'int' || inp.dataset.type === 'float') {
        val = Number(v);
        if (v === '' || !isFinite(val)) { toast('「' + inp.dataset.label + '」需填数字'); return; }
        if (inp.dataset.type === 'int' && !Number.isInteger(val)) { toast('「' + inp.dataset.label + '」需为整数'); return; }
      }
      edits.push({ path: inp.dataset.path, value: val });
    }
    if (!edits.length) { toast('没有改动'); return; }
    const btn = $('cfg-save-btn');
    if (btn) btn.disabled = true;
    let lastChanged = [];
    try {
      for (const e of edits) {
        const r = await req('PATCH', '/api/config', { path: e.path, value: e.value });
        lastChanged = r.changed || [];
        lastChanged.forEach(k => SET.pendingKeys.add(k));
      }
      toast('已保存 ' + edits.length + ' 项' + (lastChanged.length ? ',重启后生效' : ''));
    } catch (e) {
      toast('保存失败:' + e.message);
    } finally {
      if (btn) btn.disabled = false;
    }
    renderSetPage();
  }
  // 重启服务(搬自 settings.js restart)
  async function restart() {
    if (!await confirmModal('重启服务', '重启服务使新配置生效?正在执行的 AI 会话会被打断。', '重启')) return;
    try {
      await req('POST', '/api/system/restart');
    } catch (e) {
      // 仅「有会话在跑」值得二次确认强打;配置不合法等 409 强打也无法启动,直接报给用户
      if (e.status === 409 && /个任务.*执行中/.test(e.message)) {
        if (!await confirmModal('有任务在跑', e.message, '强制重启', true)) return;
        try { await req('POST', '/api/system/restart?force=true'); }
        catch (e2) { toast('重启失败:' + e2.message); return; }
      } else { toast('重启失败:' + e.message); return; }
    }
    const btn = $('restart-btn');
    if (btn) { btn.disabled = true; btn.textContent = '重启中,请勿关闭页面…'; }
    toast('服务重启中…');
    for (let i = 0; i < 90; i++) {
      await sleep(1000);
      try { const r = await fetch('/api/health'); if (r.ok) { location.reload(); return; } } catch (_) {}
    }
    toast('90 秒内未恢复,请检查容器状态(非 Docker 部署需手动启动)');
    if (btn) { btn.disabled = false; btn.textContent = '重启服务'; }
  }

  // api_key 脱敏显示兼容后端已脱敏结果(幂等)
  function maskKey(k) {
    k = k || '';
    if (k.includes('***')) return k;
    if (k.length > 8) return k.slice(0, 3) + '***' + k.slice(-4);
    if (k.length > 0) return '***' + k.slice(-2);
    return '';
  }
  // token 用量紧凑显示:<1000 原样;k(1 位小数去尾零);≥1M 用 M
  function fmtTok(n) {
    n = Number(n) || 0;
    if (n < 1000) return String(n);
    if (n < 1000000) { const v = (n / 1000).toFixed(1).replace(/\.0$/, ''); return v + 'k'; }
    const v = (n / 1000000).toFixed(1).replace(/\.0$/, '');
    return v + 'M';
  }
  function balText(gk) {
    const b = SET.balanceByGroup[gk];
    if (!b) return '余额 --';
    if (b.error) return '余额 查询失败';
    return '余额 ' + (b.total_balance == null ? '--' : b.total_balance) + (b.currency ? ' ' + esc(b.currency) : '');
  }
  function balTitle(gk) {
    const b = SET.balanceByGroup[gk];
    if (!b) return '';
    if (b.error) return '查询失败:' + b.error;
    const parts = [];
    if (b.available === false) parts.push('上游报告余额不可用');
    if (b.granted_balance != null) parts.push('赠送 ' + b.granted_balance);
    if (b.topped_up_balance != null) parts.push('充值 ' + b.topped_up_balance);
    return parts.join(' · ');
  }
  async function fetchBalance(gk, pi, ki, manual) {
    SET.balanceRequested[gk] = true; // 无论成败,本页会话不再自动重查(手动刷新不受限)
    const btn = $('mbrg-' + gk);
    if (btn) btn.classList.add('spin');
    const el = $('mbal-' + gk);
    if (el) el.textContent = '余额 …';
    try {
      const r = await req('GET', '/api/platforms/balance?pi=' + pi + '&ki=' + ki);
      const b = r.balance || {};
      SET.balanceByGroup[gk] = {
        total_balance: b.total_balance, currency: b.currency,
        granted_balance: b.granted_balance, topped_up_balance: b.topped_up_balance,
        available: b.is_available,
      };
    } catch (e) {
      SET.balanceByGroup[gk] = { error: e.message };
      if (manual) toast('查余额失败:' + e.message); // 自动查询失败只落悬停详情,不打扰
    }
    if (btn) btn.classList.remove('spin');
    const el2 = $('mbal-' + gk);
    if (el2) { el2.textContent = balText(gk); el2.title = balTitle(gk); }
  }
  // 点刷新图标:无视「本页已查过」标记,总是重新请求
  function refreshBalance(ev, pi, ki) {
    if (ev) ev.stopPropagation(); // 冒泡到分组头会误触折叠/展开
    fetchBalance(pi + '-' + ki, pi, ki, true);
  }
  const BAL_REFRESH_SVG = '<svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>';
  function toggleModelGroup(gk) {
    const on = !SET.expandedGroups[gk];
    SET.expandedGroups[gk] = on;
    const el = $('mgrp-' + gk);
    if (!el) return;
    el.classList.toggle('open', on);
    const body = el.querySelector('.model-group-body');
    if (body) body.classList.toggle('hidden', !on);
    // 首次展开自动查一次余额(余额由平台名+key 决定);标记随每次进入本页重置
    if (on && !SET.balanceRequested[gk] && $('mbal-' + gk)) {
      const parts = gk.split('-');
      fetchBalance(gk, Number(parts[0]), Number(parts[1]), false);
    }
  }
  // 单个模型的子卡片;余额是 Key 级概念,统一在分组头显示
  function modelCardHtml(m) {
    const run = SET.runtimeById[m.id];
    // 运行池里没有 = 配置新增但还没重启生效
    const stateHtml = run
      ? '<span class="model-card-state ' + (run.is_busy ? 'busy' : 'idle') + '">' + (run.is_busy ? '占用中' : '空闲') + '</span>'
      : '<span class="model-card-state pending">待重启</span>';
    return '<div class="model-card">' +
      '<div class="model-card-head">' +
        '<span class="model-card-name" title="点击编辑" onclick="sUI.mEdit(\'' + encodeURIComponent(m.id) + '\')">' + esc(m.display_name || m.mid || m.id) + '</span>' +
        '<span class="model-card-meta">' + esc(m.mid || m.id) +
          (run && run.is_busy && run.current_session_id ? ' · 会话 ' + esc(run.current_session_id) : '') + '</span>' +
        stateHtml +
      '</div>' +
      '<div class="cfg-kv"><label>今日 token</label><b title="输入 / 输出">' + (run ? fmtTok(run.today_prompt) + ' / ' + fmtTok(run.today_completion) : '--') + '</b></div>' +
      '<div class="cfg-kv"><label>累计 token</label><b title="输入 / 输出">' + (run ? fmtTok(run.total_prompt) + ' / ' + fmtTok(run.total_completion) : '--') + '</b></div>' +
    '</div>';
  }
  function modelGroupHtml(pi, ki) {
    const p = SET.cfgPlatforms[pi] || {};
    const k = (p.keys || [])[ki] || {};
    const gk = pi + '-' + ki;
    const models = SET.cfgModels.filter(m => m.platform_index === pi && m.key_index === ki);
    const open = !!SET.expandedGroups[gk];
    // 仅已接入余额查询的类型显示余额行(未接入的显示出来也只会是报错,不如不显示)
    const hasBal = SET.balanceTypes.indexOf(String(p.type || '')) >= 0;
    return '<div class="model-group' + (open ? ' open' : '') + '" id="mgrp-' + gk + '">' +
      '<div class="model-group-head" onclick="sUI.toggleGroup(\'' + gk + '\')">' +
        '<svg class="model-group-caret" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18"></polyline></svg>' +
        '<span class="model-group-name">' + esc(p.name || ('平台' + pi)) + '</span>' +
        '<span class="model-group-key">' + esc(k.api_key ? maskKey(k.api_key) : '无 key') + '</span>' +
        '<span class="model-group-meta">' + models.length + ' 模型</span>' +
      '</div>' +
      '<div class="model-group-body' + (open ? '' : ' hidden') + '">' +
        (hasBal ?
          '<div class="model-group-bal">' +
            '<span id="mbal-' + gk + '" title="' + esc(balTitle(gk)) + '">' + balText(gk) + '</span>' +
            '<button class="mbal-refresh" id="mbrg-' + gk + '" title="重新查询余额" onclick="sUI.refreshBalance(event,' + pi + ',' + ki + ')">' + BAL_REFRESH_SVG + '</button>' +
          '</div>' : '') +
        (models.length ? models.map(modelCardHtml).join('') : '<div class="model-group-empty">该 Key 下暂无模型</div>') +
      '</div>' +
    '</div>';
  }
  async function loadModelCards(ctx) {
    const el = $('model-cards');
    if (!el || (ctx && !ctx())) return;
    try {
      const [rt, cg] = await Promise.all([req('GET', '/api/models'), req('GET', '/api/config')]);
      if (ctx && !ctx()) return;
      if (!$('model-cards')) return; // 异步期间已离开本页
      SET.runtimeById = {};
      for (const m of rt || []) SET.runtimeById[m.id] = m;
      SET.cfgPlatforms = (cg.effective && cg.effective.platforms) || [];
      SET.cfgModels = (cg.effective && cg.effective.models) || [];
      SET.balanceTypes = cg.balance_types || [];
      const box = $('model-cards');
      if (!SET.cfgModels.length) {
        box.innerHTML = '<div class="empty-tip">尚未配置模型,点右上角 + 添加。</div>';
        return;
      }
      let html = '';
      SET.cfgPlatforms.forEach((p, pi) => (p.keys || []).forEach((k, ki) => {
        html += modelGroupHtml(pi, ki);
      }));
      box.innerHTML = html +
        (SET.modelsPendingRestart
          ? '<div class="empty-tip">已写入 config.yml,到「服务」页重启服务后生效。</div>'
          : '<div class="empty-tip">token 格式为「输入 / 输出」;余额在分组首次展开时自动查询,点刷新图标可重查;改动写入 config.yml,重启服务后生效。</div>');
    } catch (e) {
      const box = $('model-cards');
      if (box && (!ctx || ctx())) box.innerHTML = '<div class="empty-tip">加载失败:' + esc(e.message) + '</div>';
    }
  }
  function setPageModels(ctx) {
    setTitle('模型池');
    setActions('<button class="icon-btn" title="添加模型" onclick="sUI.openAdd()">' +
      '<svg class="ic" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button>');
    setBody('<div class="set-scroll" id="model-cards"><div class="empty-tip">加载中…</div></div>');
    // 每次进入本页:余额结果与「已自动查过」标记重置(同 index 的 Tab onShow)
    SET.balanceByGroup = {};
    SET.balanceRequested = {};
    loadModelCards(ctx);
  }
  function idxOf(id) {
    for (let i = 0; i < SET.cfgModels.length; i++) if (SET.cfgModels[i].id === id) return i;
    return -1;
  }
  function afterWrite() {
    SET.modelsPendingRestart = true;
    SET.balanceByGroup = {};      // 配置变了,旧余额不再对应现有 pi/ki 槽位
    SET.balanceRequested = {};
    toast('已写入 config.yml,到「服务」页重启后生效');
    loadModelCards();
  }
  // Key 标签:「平台名 · sk-***1234」;下拉里用它标识可挂模型的目标 Key。
  function keyLabel(pi, ki) {
    const p = SET.cfgPlatforms[pi] || {};
    const k = (p.keys || [])[ki] || {};
    return (p.name || ('平台' + pi)) + ' · ' + (k.api_key ? maskKey(k.api_key) : '无 key');
  }
  function targetOptions() {
    let html = '';
    SET.cfgPlatforms.forEach((p, pi) => (p.keys || []).forEach((k, ki) => {
      html += '<option value="exist:' + pi + ':' + ki + '">' +
        esc(keyLabel(pi, ki)) + '(' + ((k.models || []).length) + ' 模型)</option>';
    }));
    html += '<option value="newkey">＋ 在已有平台下新增 Key</option>';
    html += '<option value="newplat">＋ 新增平台</option>';
    return html;
  }
  // 切换「新增 Key / 新增平台」时显隐对应字段。
  function onTargetChange() {
    const t = $('moe-target').value || '';
    $('moe-newkey-wrap').classList.toggle('hidden', t !== 'newkey');
    $('moe-newplat-wrap').classList.toggle('hidden', t !== 'newplat');
  }
  function fillNewKeyPlatforms() {
    $('moe-nk-plat').innerHTML = SET.cfgPlatforms.map((p, i) =>
      '<option value="' + i + '">' + esc(p.name || ('平台' + i)) + '</option>').join('');
  }
  function openModelEditor(rawId) {
    const add = rawId == null;
    SET.moeIdx = add ? -1 : idxOf(decodeURIComponent(rawId));
    if (!add && SET.moeIdx < 0) return toast('模型不存在');
    const m = add ? null : SET.cfgModels[SET.moeIdx];
    $('moe-title').textContent = add ? '添加模型' : '编辑模型';
    const idIn = $('moe-id');
    idIn.value = m ? (m.mid || m.id) : '';
    idIn.disabled = !add; // 编辑时禁改 id(历史会话按「平台名/模型id」绑定,改 id 等于换模型)
    $('moe-name').value = m ? (m.display_name || '') : '';
    $('moe-vision').checked = m ? !!m.vision : false;
    const tgt = $('moe-target');
    if (add) {
      tgt.disabled = false;
      tgt.innerHTML = targetOptions();
      fillNewKeyPlatforms();
    } else {
      // 编辑时锁定目标为本模型所属 Key(移动模型 = 删除后重建,不支持就地挪)
      tgt.innerHTML = '<option value="exist:' + m.platform_index + ':' + m.key_index + '">' + esc(keyLabel(m.platform_index, m.key_index)) + '</option>';
      tgt.disabled = true;
    }
    tgt.onchange = onTargetChange;
    onTargetChange(); // add 模式默认 exist → 两组附加字段都隐藏
    $('moe-del-btn').classList.toggle('hidden', add);
    $('model-edit-modal').classList.remove('hidden');
  }
  function closeModelEditor() { $('model-edit-modal').classList.add('hidden'); }
  async function saveModelEditor() {
    const id = $('moe-id').value.trim();
    if (!id) return toast('请填写 id');
    // 模型项本身只含 id/display_name/vision;url/key/concurrency 在平台/Key 层,这里不动。
    const model = {
      id,
      display_name: $('moe-name').value.trim() || id,
      vision: $('moe-vision').checked,
    };
    const add = SET.moeIdx < 0;
    let body;
    if (!add) {
      // 编辑:精确改到 platforms[pi].keys[ki].models[mi]
      const m = SET.cfgModels[SET.moeIdx];
      body = { path: ['platforms', m.platform_index, 'keys', m.key_index, 'models', m.model_index], value: model };
    } else {
      const t = $('moe-target').value;
      // id 唯一性只看同平台(内部键 = 平台名/模型id);不同平台可同名。
      let platName = '';
      if (t === 'newkey') platName = (SET.cfgPlatforms[parseInt($('moe-nk-plat').value, 10)] || {}).name || '';
      else if (t.indexOf('exist:') === 0) platName = (SET.cfgPlatforms[Number(t.split(':')[1])] || {}).name || '';
      if (platName && SET.cfgModels.some(x => x.platform === platName && x.mid === id)) return toast('平台「' + platName + '」下已有模型 id:' + id);
      if (t === 'newplat') {
        const url = $('moe-np-url').value.trim().replace(/\/+$/, '');
        if (!url) return toast('请填写平台上游地址');
        // append 一整个新平台:含一个新 Key + 这个模型;key 明文只在此时输入一次。
        body = { op: 'append', path: ['platforms'], value: {
          name: $('moe-np-name').value.trim(),
          url,
          type: $('moe-np-type').value.trim() || 'openai',
          keys: [{ api_key: $('moe-np-key').value.trim(), concurrency: parseInt($('moe-np-con').value, 10) || 1, models: [model] }],
        } };
      } else if (t === 'newkey') {
        const pi = parseInt($('moe-nk-plat').value, 10);
        if (!(pi >= 0)) return toast('请选择平台');
        // append 一个新 Key 到已有平台;模型挂在它下面。
        body = { op: 'append', path: ['platforms', pi, 'keys'], value: {
          api_key: $('moe-nk-key').value.trim(), concurrency: parseInt($('moe-nk-con').value, 10) || 1, models: [model] } };
      } else {
        // exist:pi:ki → append 模型到已有 Key 的 models 数组
        const parts = t.split(':');
        body = { op: 'append', path: ['platforms', Number(parts[1]), 'keys', Number(parts[2]), 'models'], value: model };
      }
    }
    try {
      await req('PATCH', '/api/config', body);
      closeModelEditor();
      afterWrite();
    } catch (e) { toast('保存失败:' + e.message); }
  }
  async function delModelFromModal() {
    if (SET.moeIdx < 0) return;
    const m = SET.cfgModels[SET.moeIdx];
    closeModelEditor();
    if (SET.cfgModels.length <= 1) return toast('至少要保留一个模型');
    const ok = await confirmModal('删除模型', '删除模型「' + (m.display_name || m.id) + '」?将从 platforms 中移除该模型项。', '删除', true);
    if (!ok) return;
    try {
      // delete 到 platforms[pi].keys[ki].models[mi];YAML 数组删项会自动收紧,不影响其他行注释。
      await req('PATCH', '/api/config', { path: ['platforms', m.platform_index, 'keys', m.key_index, 'models', m.model_index], op: 'delete' });
      afterWrite();
    } catch (e) { toast('删除失败:' + e.message); }
  }

  // ---------- 设置区对外接口(动态卡片里的 onclick 均指向这里) ----------
  window.sUI = {
    // 账户
    changePassword: changePassword,
    logout: function () { location.href = '/logout'; },
    // 服务
    saveForm: saveForm,
    restart: restart,
    openCfg: openCfgEditor,
    saveCfg: saveCfg,
    closeCfg: closeCfg,
    // 技能
    open: openSkill,
    openCreate: openCreateSkill,
    closeCreate: closeCreateSkill,
    createSkill: createSkill,
    renameSkill: renameSkill,
    deleteSkill: deleteSkill,
    editFile: openSkillFile,
    saveFile: saveSkillFile,
    closeEditor: closeSkillEditor,
    newFile: newSkillFile,
    deleteFile: deleteSkillFile,
    onUpload: uploadSkillFile,
    // 模型
    openAdd: function () { openModelEditor(null); },
    mEdit: openModelEditor,
    mClose: closeModelEditor,
    mSave: saveModelEditor,
    mDel: delModelFromModal,
    toggleGroup: toggleModelGroup,
    refreshBalance: refreshBalance,
  };

  // ---------- 初始化 ----------
  selectMode('secretary'); // 默认选中【文秘助理】
  setView('welcome');
  loadSessionList();
  </script>
</body>
</html>
