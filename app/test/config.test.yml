# 冒烟测试用配置：上游指向本地 mock
# 两个模型都开 vision：让「读图」端到端测试与绑定哪个模型无关（非 vision 分支由单测覆盖）
platforms:
  - name: mock-a
    url: "http://127.0.0.1:9999/v1"
    type: openai
    models:
      - id: ds1
        display_name: "Mock Model 1"
        vision: true
    keys:
      - api_key: ""
  - name: mock-b
    url: "http://127.0.0.1:9999/v1"
    type: custom
    models:
      - id: ds2
        display_name: "Mock Model 2"
        vision: true
    keys:
      - api_key: ""
        concurrency: 1

workspace_root: "./test/tmp/tasks"
# 隔离数据目录：db/启动 prompt dump 落 tmp（随每次运行的 rm -rf 一同清掉），
# 不配则用默认 ./data，残留会话会污染下次测试的模型池调度。
data_root: "./test/tmp/data"

port: 8099

terminal:
  default_timeout_ms: 30000
  max_output_chars: 10000

agent:
  temperature: 1.0
  max_tool_iterations: 20
  max_retries: 1
  auto_complete_ms: 0   # 冒烟套件依赖 held 长期驻留（断言/追问/释放用例），关闭超时自动收口；专项覆盖见 test/hold-sweep.test.js

# 冒烟测试用短租约，验证 held → 自动释放
model_hold:
  idle_release_ms: 1500
  active_max_ms: 8000
  sweep_ms: 300
