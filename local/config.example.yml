# 本机 local 模式的配置参考。
#
# ⚠️ 这个文件不会被读取，只是给人看的样板：真正的配置由 local/start.sh 首次运行时
#    生成到 local/config.local.yml（含你选的工作目录与分配好的端口）。
#    想看自己机器上实际生成成什么样，启动一次后直接打开 local/config.local.yml。
#
# 字段含义与服务器版完全一致（见 app/config.example.yml）；下面只列 local 模式实际用到的那部分。

port: 8090

# AI 的工作根。local 模式注入 AGENT_FILE_SCOPE=workspace 后，文件工具可读写这个目录下任何位置。
workspace_root: /Users/you/AgentWork

# SQLite（.agent.db）与启动 prompt dump。默认指到仓库里的 data/（已在 .gitignore）。
data_root: /path/to/agent/data

skills:
  # 指向 local/.runtime/skills —— 启动脚本按「python3 是否可用」把它软链到真技能目录或空目录，
  # 因此装不装 python3 都不需要改这里，改完重跑启动脚本即生效。
  skills_root: /path/to/agent/local/.runtime/skills

# 留空：启动后到设置页添加平台与 API Key，再点「重启」（启动器负责把进程拉起来）。
platforms: []

log_level: info

mcp_servers:
  # 四个同栈 MCP 由启动器在本机拉起，端口与 start.sh 里的默认值对应（8091~8094，
  # 紧跟在 core 的 8090 后面；改 PORT 时别撞上这四个）。
  # web_search 不需要任何密钥（内置免费后端）；其余三个的上游参数在设置页卡片里填，
  # 会写进对应条目的 headers。
  - name: web_search
    url: "http://127.0.0.1:8091/"
  - name: image_task
    url: "http://127.0.0.1:8092/mcp"
    mode: skill
  - name: video_task
    url: "http://127.0.0.1:8093/mcp"
    mode: skill
  - name: asr
    url: "http://127.0.0.1:8094/mcp"
    mode: skill
    # 例：填了这两项才算启用语音（缺 X-ASR-Base-Url 时 /api/asr/status 返回 enabled:false，麦克风自动隐藏）
    # headers:
    #   Authorization: Bearer <key>
    #   X-ASR-Base-Url: "https://<host>/v1"
    #   X-ASR-Model: "whisper-1"
