services:
  mcp-web-search-free:
    build: ./web-search-free
    container_name: mcp-web-search-free
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=web-search.ai.foresh.com
      - VIRTUAL_PORT=3000
      - CERT_NAME=default
    networks:
      - my-app-network

  mcp-image-gen:
    build: ./image-gen
    container_name: mcp-image-gen
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=image-gen.ai.foresh.com
      - VIRTUAL_PORT=3000
      - CERT_NAME=default
    networks:
      - my-app-network

  mcp-video-gen:
    build: ./video-gen
    container_name: mcp-video-gen
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=video-gen.ai.foresh.com
      - VIRTUAL_PORT=3000
      - CERT_NAME=default
    networks:
      - my-app-network

networks:
  my-app-network:
    external: true