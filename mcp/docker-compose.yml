services:
  mcp_web_search:
    build: ./web_search
    container_name: mcp_web_search
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=web-search.ai.foresh.com
      - VIRTUAL_PORT=3000
      - CERT_NAME=default
    networks:
      - my-app-network

  mcp_image_gen:
    build: ./image_gen
    container_name: mcp_image_gen
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=image-gen.ai.foresh.com
      - VIRTUAL_PORT=3000
      - CERT_NAME=default
    networks:
      - my-app-network

  mcp_video_gen:
      build: ./video_gen
      container_name: mcp_video_gen
      restart: unless-stopped
      expose:
        - "3000"
      environment:
        - VIRTUAL_HOST=video-gen.ai.foresh.com
        - VIRTUAL_PORT=3000
        - CERT_NAME=default
        - PUBLIC_BASE_URL=https://video-gen.ai.foresh.com
      networks:
        - my-app-network

networks:
  my-app-network:
    external: true
