# 无 nginx-proxy 部署：每个服务把容器 3000 映射到各自宿主机端口，用 http://<服务器IP>:<端口>/mcp 访问。
# 端口可用 .env / 环境变量覆盖（WEB_SEARCH_PORT / IMAGE_GEN_PORT / VIDEO_GEN_PORT）。
services:
  mcp_web_search:
    build: ./web_search
    container_name: mcp_web_search
    restart: unless-stopped
    ports:
      - "${WEB_SEARCH_PORT:-8081}:3000"
    networks:
      - my-app-network

  mcp_image_gen:
    build: ./image_gen
    container_name: mcp_image_gen
    restart: unless-stopped
    ports:
      - "${IMAGE_GEN_PORT:-8082}:3000"
    networks:
      - my-app-network

  mcp_video_gen:
    build: ./video_gen
    container_name: mcp_video_gen
    restart: unless-stopped
    ports:
      - "${VIDEO_GEN_PORT:-8083}:3000"
    environment:
      # /upload 返回给浏览器/AI 的 URL 前缀，必须是【外部可达】地址：
      # 无域名时填 http://<服务器IP>:<VIDEO_GEN_PORT>，否则智谱取不到图，图生视频会失败。
      # 不设则退化为 http://localhost:8083（只在本机 curl 调试时可用）。
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8083}
    networks:
      - my-app-network

networks:
  # 与 agent 仓库共用：网络由 agent 的 compose 创建并命名（所以要先起 agent），
  # 这里声明为 external 直接加入。agent-core 按容器名访问这些服务，如 http://mcp_web_search:3000/。
  my-app-network:
    external: true
