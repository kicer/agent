# 无 nginx-proxy 部署：这些服务**默认不占宿主机端口**，只挂在 agent-mcp-net 上被 agent 按容器名访问。
# 因此对外只需要开 agent-core 那一个端口（AGENT_PORT，默认 8090）。
# 需要从宿主机 curl 调试某个服务时，把它下面注释掉的 ports 两行打开。
services:
  mcp_web_search:
    build: ./web_search
    container_name: mcp_web_search
    restart: unless-stopped
    # 调试用（默认关）：
    # ports:
    #   - "${WEB_SEARCH_PORT:-8081}:3000"
    networks:
      - agent-mcp-net

  mcp_image_task:
    build: ./image_task
    container_name: mcp_image_task
    restart: unless-stopped
    # 调试用（默认关）：
    # ports:
    #   - "${IMAGE_TASK_PORT:-8082}:3000"
    networks:
      - agent-mcp-net

  mcp_video_task:
    build: ./video_task
    container_name: mcp_video_task
    restart: unless-stopped
    # 调试用（默认关；这里映的是 MCP 端口，会暴露 /mcp，仅本机短时调试用）：
    # ports:
    #   - "${VIDEO_TASK_PORT:-8083}:3000"
    networks:
      - agent-mcp-net

networks:
  # 与 agent 仓库共用：网络由 agent 的 compose 创建并命名（所以要先起 agent），
  # 这里声明为 external 直接加入。agent-core / agent-executor 按容器名访问这些服务。
  agent-mcp-net:
    external: true
