# 无 nginx-proxy 部署：这些服务**默认不占宿主机端口**，只挂在 agent-mcp-net 上被 agent 按容器名访问。
# 因此对外只需要开 agent-core 那一个端口（AGENT_PORT，默认 8090）。
# 需要从宿主机 curl 调试某个服务时，把它下面注释掉的 ports 两行打开。
services:
  mcp_web_search:
    build: ./web_search
    container_name: mcp_web_search
    restart: unless-stopped
    # 调试用（默认关）：
    # ports:
    #   - "${WEB_SEARCH_PORT:-8081}:3000"
    networks:
      - agent-mcp-net

  mcp_image_task:
    build: ./image_task
    container_name: mcp_image_task
    restart: unless-stopped
    # 调试用（默认关）：
    # ports:
    #   - "${IMAGE_TASK_PORT:-8082}:3000"
    networks:
      - agent-mcp-net

  mcp_video_task:
    build: ./video_task
    container_name: mcp_video_task
    restart: unless-stopped
    # 调试用（默认关；这里映的是 MCP 端口，会暴露 /mcp，仅本机短时调试用）：
    # ports:
    #   - "${VIDEO_TASK_PORT:-8083}:3000"
    networks:
      - agent-mcp-net

  mcp_officecli:
    build: ./officecli
    container_name: mcp_officecli
    restart: unless-stopped
    environment:
      # 关自动 resident：实测对时延零增益（瓶颈是 .NET 进程启动），换来无 file_locked 冲突、无常驻进程堆积
      - OFFICECLI_NO_AUTO_RESIDENT=1
      # 每次改动命令返回前落盘（含 open 起的 resident）：编辑即自动保存，save/close 只为签发取件链接
      - OFFICECLI_RESIDENT_FLUSH=each
      # scratch 卫生：闲置 7 天整目录回收；容量水位 2G（超限按目录 mtime 从旧到新删，删到 80% 为止）
      - OFFICE_SCRATCH_TTL_MS=604800000
      - OFFICE_SCRATCH_MAX_BYTES=2147483648
    volumes:
      # officecli 二进制缓存：entrypoint 首启拉取（镜像内 pin 版本+sha256，每次启动都校验），容器重建不重拉；down -v 后下次启动自动重拉；纯离线机改 bind 挂载手工放置（见 officecli/README）
      - officecli-bin:/opt/officecli
      # 刻意不挂 ../agent/tasks：容器对会话数据盲视，只有自己的 scratch 工作区（布局同构 /workspace/tasks/<会话id>/...）。
      # 与交付区的数据交换全部经 push（拉 mint 外链进来）/ pull（AI 在 executor 里执行 curl 写回自己目录）。
      - office-scratch:/workspace/tasks
    networks:
      - agent-mcp-net

networks:
  # 与 agent 仓库共用：网络由 agent 的 compose 创建并命名（所以要先起 agent），
  # 这里声明为 external 直接加入。agent-core / agent-executor 按容器名访问这些服务。
  agent-mcp-net:
    external: true

volumes:
  # officecli 工作区：丢了不要紧（push/pull 流程会重建），down -v 即清空
  office-scratch:
  # officecli 二进制缓存：丢了也不要紧，下次启动 entrypoint 自动重新拉取
  officecli-bin:
