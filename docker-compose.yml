services:
  agent:
    build: ./app
    restart: unless-stopped
    expose:
      - "8080"                          # 仅内网暴露，由 nginx-proxy 对外
    volumes:
      - ./data:/workspace/tasks         # 持久化：任务目录 + SQLite（.agent.db 在此目录内）
      - ./config.yml:/app/config.yml:ro
    environment:
      - PORT=8080
      - AGENT_CONFIG=/app/config.yml
      - VIRTUAL_HOST=agent.ai.foresh.com
      - VIRTUAL_PORT=8080
      - CERT_NAME=default
    networks:
      - my-app-network

networks:
  my-app-network:
    external: true